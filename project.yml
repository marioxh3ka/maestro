name: Maestro
options:
  deploymentTarget:
    iOS: "15.0"
settingGroups:
  common:
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
targets:
  MaestroCRT:
    type: application
    platform: iOS
    sources:
      - Sources
      - Apps/MaestroCRT
    settings:
      groups: [common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.maestrocrt.ios
        INFOPLIST_KEY_CFBundleDisplayName: Maestro CRT
  MaestroSNR:
    type: application
    platform: iOS
    sources:
      - Sources
      - Apps/MaestroSNR
    settings:
      groups: [common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.maestrosnr.ios
        INFOPLIST_KEY_CFBundleDisplayName: Maestro SNR
