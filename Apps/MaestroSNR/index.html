:root{--paper:#f6f7f2;--grid:#d5e1ec;--ink:#1c2840;--soft:#566177;--red:#cf2e2a;--green:#16805a;--hi:#ffe75e;--blue:#2c62b8;--white:#fff;--m:30px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none;background:var(--paper);color:var(--ink);font:400 17px/1.5 Body,sans-serif}
#app{height:100%;display:flex;flex-direction:column}
.page{flex:1;overflow-y:auto;padding:18px 16px 28px calc(var(--m) + 12px);background-color:var(--paper);
 background-image:linear-gradient(90deg,transparent calc(var(--m) - 1px),#e58b86 calc(var(--m) - 1px),#e58b86 var(--m),transparent var(--m)),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
 background-size:100% 100%,20px 20px,20px 20px;background-attachment:local}
h1,h2,h3{font-family:Head,sans-serif;line-height:1.12;margin:0;letter-spacing:-.01em}
h1{font-size:36px;font-weight:800}h2{font-size:25px;font-weight:700}h3{font-size:19px;font-weight:700}
p{margin:0 0 12px}.step ul{margin:6px 0 12px;padding-left:20px}.step li{margin-bottom:7px}
.muted{color:var(--soft)}.small{font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tabs{padding-bottom:env(safe-area-inset-bottom,0px);display:flex;background:var(--white);border-top:2px solid var(--ink)}
.tabs button{flex:1;padding:11px 2px 12px;font:700 14px Body;color:var(--soft)}
.tabs button.on{color:var(--red);box-shadow:inset 0 3px 0 var(--red)}
.btn{display:block;width:100%;padding:14px 16px;background:var(--ink);color:#fff;font-weight:700;border-radius:4px;text-align:center}
.btn[disabled]{background:#b9c0cc}.btn.alt{background:var(--white);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.hero{margin-bottom:18px}.hero .sum{margin:8px 0 14px}
.mod{margin-bottom:6px;background:rgba(255,255,255,.72);box-shadow:inset 0 -1px 0 var(--grid)}
.mod>button{display:flex;gap:10px;width:100%;text-align:left;padding:12px 8px;align-items:baseline}
.mod .n{font:700 22px Hand;color:var(--red);min-width:26px}.mod .c{margin-left:auto;font-size:14px;color:var(--soft);white-space:nowrap}
.mod .d{display:block;font-size:14px;color:var(--soft);font-weight:400}
.ls{display:flex;gap:10px;width:100%;padding:9px 8px 9px 12px;text-align:left;align-items:center}
.box{flex:none;width:21px;height:21px;border:2px solid var(--ink);background:#fff;border-radius:2px;position:relative}
.box.ok::after{content:"";position:absolute;left:5px;top:-5px;width:8px;height:18px;border:solid var(--red);border-width:0 3px 3px 0;transform:rotate(40deg)}
.top{display:flex;align-items:center;gap:12px;padding:9px 14px;background:var(--white);border-bottom:2px solid var(--ink)}
.top .x{font:700 22px Body;width:30px;height:30px}.bar{flex:1;height:6px;background:var(--grid);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red)}
.top .pg{font:700 15px Hand;color:var(--soft);white-space:nowrap}
.foot{display:flex;gap:10px;padding:10px 14px;background:var(--white);border-top:2px solid var(--ink)}.foot .btn.alt{width:38%}
.step h2{margin-bottom:12px}
.note{font:400 18px/1.32 Hand,cursive;color:var(--red);margin:14px 0;padding-left:12px;border-left:3px solid var(--red)}
mark{background:var(--hi);color:inherit;padding:0 2px}
.chart{margin:12px 0 4px}.chart svg{display:block;width:100%;height:auto;overflow:visible}
.cap{font:400 16px Hand;color:var(--soft);margin:0 0 8px}
.replay{font:700 15px Hand;color:var(--blue);padding:2px 0 8px}
.q{margin-top:16px;padding-top:12px;border-top:2px dashed var(--ink)}.q h3{margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;padding:12px;margin-bottom:9px;background:#fff;box-shadow:inset 0 0 0 2px var(--ink);border-radius:4px}
.opt.ok{box-shadow:inset 0 0 0 3px var(--green);color:var(--green);font-weight:700}
.opt.no{box-shadow:inset 0 0 0 2px var(--red);color:var(--red);text-decoration:line-through}
.why{font:400 18px/1.32 Hand;margin-top:8px}.why.ok{color:var(--green)}.why.no{color:var(--red)}
.card{display:block;width:100%;text-align:left;background:#fff;padding:14px;margin-bottom:12px;box-shadow:inset 0 0 0 2px var(--ink);border-radius:4px}
.card b{font-family:Head;font-size:19px;display:block;margin-bottom:2px}
.rows{margin:10px 0}.rows div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--grid)}.rows b{text-align:right}
.done{text-align:center;padding-top:40px}.stamp{display:inline-block;font:700 42px Hand;color:var(--red);transform:rotate(-6deg);border:3px solid var(--red);border-radius:8px;padding:0 18px;margin-bottom:18px}
input[type=search]{width:100%;font:inherit;padding:11px;border:2px solid var(--ink);border-radius:4px;background:#fff;margin:12px 0}
.gl{padding:9px 0;border-bottom:1px solid var(--grid)}.gl b{display:block}
.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:#fff;box-shadow:inset 0 0 0 2px var(--ink);border-radius:4px;padding:18px;margin:14px 0;width:100%}
.flash .w{font:700 30px Head}.flash .a{font-size:18px}
.chk{display:flex;gap:10px;width:100%;text-align:left;padding:10px 0;align-items:flex-start;border-bottom:1px solid var(--grid)}
.clock{display:flex;gap:18px;margin:10px 0 2px}.clock div{flex:1}.clock b{font:800 32px Head;display:block}
.sp{height:14px}.link{color:var(--blue);font-weight:700;text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.fld{display:block;margin-bottom:10px}.fld span{display:block;font-size:15px;color:var(--soft);margin-bottom:3px}.fld input,.fld select{width:100%;font:inherit;padding:10px;border:2px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink)}
.rl{padding-left:24px;margin:14px 0}.rl li{margin-bottom:12px}.rl li::marker{font:700 20px Hand;color:var(--red)}
.ct{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--grid)}.ct>div{flex:1}.ct .bar{margin-top:6px}.mm{width:38px;height:38px;font:700 22px Body;background:#fff;box-shadow:inset 0 0 0 2px var(--ink);border-radius:4px}.ct span{min-width:46px;text-align:center;font-size:15px}
</style>

  {s:'Il metodo poggia su quattro pilastri:',l:['**Zone SNR** nate da due candele','**Multi-timeframe**: settimanale, giornaliero, H4','**Tre conferme** prima di entrare','**Storyline**: la direzione raccontata dal timeframe alto'],m:'Il PDF traduce "storyline" a volte con "trama", a volte con "scenario". Qui uso sempre storyline.',q:{q:'Quale di questi NON è un pilastro del metodo?',o:['RSI e MACD','Zone SNR','Tre conferme'],a:0,w:'Il metodo non usa indicatori: solo prezzo, candele, zone e struttura.'}}
 ]},
 {id:'a2',t:'Cosa prendere e cosa lasciare',p:'pag. 2-7, 25-26, 31-33',st:[
  {s:'Questo ebook è anche pubblicità per un gruppo a pagamento. Devi saper separare il **metodo**, che possiamo studiare, dalla **vendita**.\n\nStoria personale, testimonianze e frasi come "agisci o muori" servono a convincerti, non a insegnarti.'},
  {s:'Tratta queste cose con molta prudenza:',l:['**Risultati come 1.000 $ in 250.000 $ in 2 giorni:** non sono verificabili. Ottenerli richiede un rischio enorme, che di solito azzera il conto.','**"Deposita tanto":** il capitale non migliora il metodo. Aumenta solo quanto puoi perdere.','**"Azione rapida = risultati rapidi":** è una leva di vendita. Il metodo stesso chiede pazienza.','**"Tre conferme sono quasi certezza":** nel trading non esiste certezza.','**Regola 70% psicologia, 30% strategia:** è un\'opinione, non un dato misurato.'],m:'Se qualcuno ti promette ricchezza in pochi giorni, proteggi il portafoglio. Non depositare mai soldi che non puoi perdere o per pagare debiti.'},
  {s:'Tieni invece la parte tecnica. Le regole su zone, conferme, chiusure e rapporto rischio-rendimento sono chiare e si possono verificare su storico.',q:{q:'L\'ebook dice che chi deposita di più guadagna più facilmente. Cosa è vero?',o:['A parità di rischio %, cambia solo la cifra: le perdite crescono quanto i guadagni','Un conto più grande rende il metodo più preciso','Depositare tanto riduce il rischio'],a:0,w:'Il conto più grande non cambia la percentuale di vincita. Ingrandisce gli importi, in entrambe le direzioni.'}}
 ]},
 {id:'a3',t:'Candele e pip',p:'prerequisito',st:[
  {s:'Una candela ha apertura, massimo, minimo e chiusura. Il **corpo** va da apertura a chiusura, gli **stoppini** arrivano agli estremi.\n\nIn questo metodo **rialzista** e **ribassista** sono tutto: ogni zona nasce dall\'ordine di due candele.',d:at(K.anat,2,{live:true,cap:'Rialzista, poi ribassista'})},
  {s:'Il **pip** è l\'unità di movimento del prezzo.',m:'Sull\'oro il pip cambia da broker a broker: spesso 0,10 $, ma alcuni contano 0,01 $. Prima di fidarti di "500 pip" verifica cosa significa sul tuo conto. L\'ebook non lo specifica.',q:{q:'Quando una candela è ribassista?',o:['Quando chiude più in basso di dove ha aperto','Quando ha uno stoppino lungo','Quando è più piccola della precedente'],a:0,w:'Conta il rapporto tra apertura e chiusura.'}}
 ]},
 {id:'a4',t:'Prezzo contro indicatori',p:'pag. 6-7',st:[
  {s:'L\'ebook esclude RSI, MACD, Bollinger e stocastico: sono calcolati su prezzi passati e quindi arrivano in ritardo. Restano prezzo, candele, zone e struttura.',m:'Anche zone e candele sono passato. Il vero vantaggio è la semplicità, non "vedere prima degli altri". Il test su storico deciderà se le regole ti danno un vantaggio.'},
  {s:'Quando senti il bisogno di entrare, fatti tre domande:',l:['Ho un livello di supporto o resistenza?','Ho un segnale di rifiuto?','Ho una conferma?'],q:{q:'Hai due sì e un no alle tre domande. Cosa fai?',o:['Chiudo il grafico e non entro','Entro con metà lotto','Entro, due sì bastano'],a:0,w:'Servono tre sì. Altrimenti ci si allontana e si torna con la mente lucida.'}}
 ]}
]},
{id:'m1',t:'Zone SNR',d:'Come nasce una zona: la regola delle due candele.',ls:[
 {id:'b1',t:'Il supporto',p:'pag. 8-9',st:[
  {s:'Per l\'ebook una zona non è una linea tracciata a occhio. Nasce da **due candele in un ordine preciso**.\n\nPrima una candela **ribassista**: i venditori fanno l\'ultima spinta.',d:at(K.sup,1)},
  {s:'Poi una candela **rialzista**: i compratori prendono il controllo. Ora il supporto è confermato.',d:at(K.sup,2,{live:true}),m:'L\'ebook non dice dove finisce esattamente la zona. Io la disegno attorno al punto di inversione delle due candele. Decidi tu una regola precisa e usa sempre quella.',q:{q:'Quale sequenza crea un supporto?',o:['Ribassista, poi rialzista','Rialzista, poi ribassista','Due rialziste'],a:0,w:'Prima chi attacca (venditori), poi chi vince (compratori).'}}
 ]},
 {id:'b2',t:'La resistenza',p:'pag. 8-9',st:[
  {s:'Specchio esatto: prima **rialzista**, poi **ribassista**. I compratori fanno l\'ultima spinta, i venditori prendono il controllo.',d:at(K.res,2,{live:true})},
  {s:'L\'ebook usa l\'immagine della fortezza: un esercito attacca, l\'altro difende e vince. La prima candela mostra chi attacca, la seconda chi ha vinto.',q:{q:'Sul grafico vedi una candela rialzista seguita da una ribassista. Cosa si forma?',o:['Una resistenza','Un supporto','Niente'],a:0,w:'Rialzista poi ribassista = resistenza.'}}
 ]},
 {id:'b3',t:'Una candela non basta',p:'pag. 9',st:[
  {s:'Una sola candela, anche con un bel rifiuto, **non è una zona**. Servono sempre due candele nell\'ordine giusto.',d:K.one,q:{q:'Una grande candela rialzista parte da un minimo. Da sola, è una zona?',o:['No, servono due candele','Sì, se è grande','Sì, se è sul giornaliero'],a:0,w:'Regola senza eccezioni: una candela non crea una zona.'}}
 ]},
 {id:'b4',t:'Quale zona è più forte',p:'pag. 8, 21, 30',st:[
  {s:'Due criteri:',l:['**Timeframe:** la settimanale batte la giornaliera, la giornaliera batte H4.','**Freschezza:** mai toccata = la più forte. Toccata una volta = più debole. Toccata due volte = da evitare.']},
  {s:'Attenzione a una contraddizione.',m:'A pag. 6 l\'ebook loda una zona "rispettata 3 volte", ma la regola 10 dice di evitare quelle toccate due volte. Nel corso seguo la regola 10, che è quella scritta come regola. Sul tuo storico puoi misurare chi ha ragione.',q:{q:'Hai due zone H4 di acquisto: una mai toccata, una toccata due volte. Quale scegli?',o:['Quella mai toccata','Quella toccata due volte','Indifferente'],a:0,w:'Regola 10: prima le zone nuove.'}}
 ]}
]},
{id:'m2',t:'RBS e SBR',d:'Quando una zona rotta cambia ruolo.',ls:[
 {id:'c1',t:'Resistenza che diventa supporto',p:'pag. 9-10',st:[
  {s:'**RBS** significa Resistance Become Support. Si parte da una resistenza normale.',d:at(K.rbs,2)},
  {s:'Il prezzo la **rompe**. I compratori hanno conquistato la fortezza dei venditori.',d:at(K.rbs,4,{live:true})},
  {s:'Quando il prezzo torna, aspetti **una ribassista che testa la zona**.',d:at(K.rbs,6,{live:true})},
  {s:'Poi **una rialzista che conferma**. Quello è il punto di ingresso.',d:at(K.rbs,7,{live:true}),q:{q:'Il prezzo ha rotto una resistenza e sta correndo. Cosa fai?',o:['Aspetto il ritorno sulla zona e la conferma','Compro subito per non perdere il movimento','Vendo perché è salito troppo'],a:0,w:'Si aspetta il ritorno: ribassista di test, poi rialzista di conferma.'}}
 ]},
 {id:'c2',t:'Supporto che diventa resistenza',p:'pag. 8',st:[
  {s:'**SBR** è il contrario: un supporto viene rotto e diventa resistenza. Il prezzo risale, una rialzista testa la zona, una ribassista conferma.',d:at(K.sbr,7),m:'L\'ebook cita SBR nel titolo ma non lo spiega. Questa è la logica speculare dell\'RBS.',q:{q:'In un SBR, quale candela conferma la vendita?',o:['Una ribassista dopo il test','Una rialzista dopo il test','Qualsiasi candela'],a:0,w:'Rialzista di test, poi ribassista di conferma: la sequenza della resistenza.'}}
 ]}
]},
{id:'m3',t:'Il Quasimodo',d:'Il pattern QM: cinque punti in sequenza.',ls:[
 {id:'d1',t:'La sequenza H, HL, HH, LL',p:'pag. 10',st:[
  {s:'Il **QM** è il pattern che l\'ebook considera il più forte. Si costruisce punto per punto.\n\n**H:** il prezzo sale a una resistenza confermata (rialzista, poi ribassista).',d:at(K.qm,0,{np:2})},
  {s:'**HL:** scende a un supporto confermato (ribassista, poi rialzista).',d:at(K.qm,0,{np:3})},
  {s:'**HH:** supera H. Si forma una nuova resistenza più in alto.',d:at(K.qm,0,{np:4})},
  {s:'**LL:** scende sotto HL. Si forma un nuovo supporto. Questo è il punto che cambia la storia: il minimo è stato rotto.',d:at(K.qm,0,{np:5}),q:{q:'Qual è l\'ordine giusto?',o:['H, HL, HH, LL, LH','HH, H, LL, HL, LH','LL, HL, H, HH, LH'],a:0,w:'Massimo, minimo più alto, massimo più alto, minimo più basso, ritorno su un massimo più basso.'}}
 ]},
 {id:'d2',t:'Entrata sulla zona LH',p:'pag. 11',st:[
  {s:'**LH:** il prezzo risale ma resta sotto HH. Qui una rialzista seguita da una ribassista conferma la resistenza. È la zona di vendita.\n\nL\'obiettivo è tornare verso LL.',d:at(K.qm,0,{np:7})},
  {s:'L\'errore tipico è vendere "dal massimo" a occhio. Prima devi aver verificato ogni punto con la sua conferma a due candele.',m:'L\'ebook mostra solo la versione di vendita. Il QM di acquisto è lo specchio: L, LH, LL, HH, poi HL. Il disegno qui sotto è quello di acquisto.',d:flip(at(K.qm,0,{np:7,marks:[]})),q:{q:'In un QM di vendita, dove entri?',o:['Sulla zona LH confermata','Sul punto HH','Sul punto LL'],a:0,w:'Si vende sul massimo più basso, dopo la conferma rialzista-ribassista.'}}
 ]}
]},
{id:'m4',t:'Multi-timeframe',d:'Una zona allineata su tre grafici.',ls:[
 {id:'e1',t:'La gerarchia',p:'pag. 12',st:[
  {s:'Ogni timeframe ha un ruolo:',l:['**Mensile:** la storia di fondo. Forza massima.','**Settimanale:** zone principali e direzione.','**Giornaliero:** zone chiave e storyline.','**H4:** dove nascono gli ingressi.','**H1 e M30:** conferma.','**M15 e M5:** solo precisione d\'ingresso. Forza minima.']},
  {s:'La regola è sempre la stessa: il timeframe superiore comanda.',q:{q:'Secondo l\'ebook, a cosa serve M5?',o:['Solo a rendere preciso l\'ingresso','A stabilire la direzione','A trovare le zone principali'],a:0,w:'M15 e M5 servono solo per la precisione.'}}
 ]},
 {id:'e2',t:'Costruire la zona allineata',p:'pag. 12-13',st:[
  {s:'Il processo, sempre uguale:',l:['Parti dal **settimanale** e segna le zone SNR.','Sul **giornaliero** cerca zone che coincidono.','Su **H4** conferma che la stessa zona esiste.','Se tutti e tre indicano lo stesso punto, è il tuo ingresso ottimale.','Metti un **avviso**, chiudi il grafico, aspetta.']},
  {s:'Prima di entrare, passa sul settimanale: **sai spiegare il mercato in una frase?** Se no, non sei pronto.',m:'Una frase di esempio: "L\'oro è rialzista sul settimanale, il giornaliero è su una zona di acquisto, aspetto le tre conferme su H4".',q:{q:'Hai un RBS bellissimo su H1, ma nulla su giornaliero e settimanale. Cosa fai?',o:['Non è il setup ottimale: cerco l\'allineamento','Entro subito, è pulito','Aumento il lotto'],a:0,w:'L\'ingresso ottimale chiede settimanale, giornaliero e H4 sulla stessa zona.'}}
 ]}
]},
{id:'m5',t:'Le 3 conferme',d:'Rifiuto, nuovo SNR, rottura. Poi il pullback.',ls:[
 {id:'f1',t:'Conferma 1: il rifiuto',p:'pag. 15',st:[
  {s:'Il prezzo arriva nella zona di acquisto. Compare una ribassista con uno stoppino di rifiuto: i venditori hanno spinto ma non ce l\'hanno fatta.\n\nÈ il primo segnale che la zona lavora. **Da solo non basta.**',d:at(K.conf,3,{live:true}),q:{q:'Vedi solo uno stoppino nella zona. Entri?',o:['No, è solo la prima conferma','Sì, è il segnale','Sì, ma senza stop'],a:0,w:'L\'esempio di errore dell\'ebook è proprio questo: entrare su uno stoppino.'}}
 ]},
 {id:'f2',t:'Conferma 2: nuovo SNR',p:'pag. 15',st:[
  {s:'Subito dopo si forma un nuovo supporto, un po\' più in alto: ribassista, poi rialzista. La direzione inizia a girare.',d:at(K.conf,6,{live:true})},
  {s:'L\'ebook si contraddice qui.',m:'A pag. 15 dice che con due conferme "puoi entrare" a rischio medio. Nella stessa pagina e nella regola 4 dice "tutte e tre o niente". Nel corso vale la regola: tre conferme.',q:{q:'Hai rifiuto e nuovo SNR, manca la rottura. Secondo la regola 4?',o:['Non entro ancora','Entro con tutto il lotto','Chiudo il grafico per sempre'],a:0,w:'Regola 4: solo tutte e tre insieme danno il sì.'}}
 ]},
 {id:'f3',t:'Conferma 3: la rottura',p:'pag. 15',st:[
  {s:'Il prezzo supera la resistenza e una candela **chiude sopra**. Lo stoppino che sfiora non conta.',d:at(K.conf,7,{live:true}),q:{q:'Una candela supera la resistenza con lo stoppino e chiude sotto. È la terza conferma?',o:['No, deve chiudere sopra','Sì, l\'ha superata','Sì, se è H4'],a:0,w:'Regola 5: conta la chiusura. Gli stoppini sono trappole.'}}
 ]},
 {id:'f4',t:'L\'ingresso sul pullback',p:'pag. 15-16',st:[
  {s:'Dopo la rottura **non entri subito**. Aspetti che il prezzo torni sul livello rotto. Quello è l\'ingresso: rischio più piccolo e prova già vista.',d:at(K.conf,9,{live:true})},
  {s:'Il riepilogo in cinque passi: **zona, rifiuto, nuovo SNR, chiusura oltre la resistenza, pullback.**',m:'Il pullback non arriva sempre: a volte il prezzo riparte senza di te. Accettalo. Inseguire significa rompere il metodo.',q:{q:'La candela di rottura ha appena chiuso. Cosa fai?',o:['Aspetto il pullback sul livello rotto','Entro a mercato','Metto un ordine sul massimo'],a:0,w:'Si entra sul ritorno al livello di rottura.'}}
 ]}
]},
{id:'m6',t:'La storyline',d:'Operare con la storia del timeframe alto.',ls:[
 {id:'g1',t:'Le tre storyline',p:'pag. 18',st:[
  {s:'Ogni timeframe racconta una storia:',l:['**Mensile:** la direzione generale.','**Settimanale:** la direzione principale. Se è rialzista, cerchi solo acquisti su giornaliero e H4.','**Giornaliera:** la bussola di ogni giorno. Rialzista = compri su H4. Ribassista = vendi su H4.'],m:'L\'ebook dice che l\'oro è rialzista da anni e quindi cerca quasi sempre acquisti. Era vero per quel periodo: non è una legge. Controlla sempre la storyline attuale.',q:{q:'Quale storyline è la bussola quotidiana?',o:['Giornaliera','Mensile','M5'],a:0,w:'Giornaliera: decide acquisti o vendite su H4.'}}
 ]},
 {id:'g2',t:'Come nasce una storyline',p:'pag. 18-19',st:[
  {s:'Tre fasi, le stesse delle conferme, sul timeframe della storyline:',l:['**Fase 1, rifiuto:** il prezzo raggiunge la zona, ribassista poi rialzista.','**Fase 2, nuovo SNR:** ribassista poi rialzista dentro la zona.','**Fase 3, rottura:** la candela chiude sopra la resistenza. La storyline parte ufficialmente.'],d:at(K.conf,7)},
  {s:'Dalla fase 3 cerchi solo acquisti, finché la storia non cambia.',q:{q:'Quando inizia ufficialmente una storyline rialzista giornaliera?',o:['Quando una candela giornaliera chiude sopra la resistenza','Al primo rifiuto','Quando lo dice il gruppo'],a:0,w:'La fase 3 segna l\'inizio.'}}
 ]},
 {id:'g3',t:'Conflitto = niente trade',p:'pag. 19-20',st:[
  {s:'Settimanale rialzista e giornaliero ribassista: è un **conflitto**. La risposta è non fare niente e aspettare che si allineino.',m:'Il PDF scrive "Nessun conflitto = nessun vantaggio": è un errore di traduzione. Il senso giusto è che in presenza di conflitto non c\'è vantaggio.',q:{q:'Settimanale rialzista, giornaliero ribassista, bella vendita su H4. Cosa fai?',o:['Niente: aspetto l\'allineamento','Vendo','Compro'],a:0,w:'Conflitto = nessun trade. L\'esercito più grande è il settimanale.'}}
 ]}
]},
{id:'m7',t:'Gestione del trade',d:'Entrata, take profit, stop e mantenimento.',ls:[
 {id:'h1',t:'Piano d\'ingresso',p:'pag. 21',st:[
  {s:'Tutto va deciso **prima** che il prezzo arrivi:',l:['Segna le zone su settimanale, giornaliero e H4.','Metti un avviso e allontanati.','Sulla zona aspetta le tre conferme.','Entra sul pullback.','Dai la priorità alle zone fresche.'],q:{q:'Quando vanno segnate le zone?',o:['Prima che il prezzo ci arrivi','Quando il prezzo è già lì','Dopo l\'ingresso'],a:0,w:'Regola 3: zona, attesa, conferma, ingresso. Mai il contrario.'}}
 ]},
 {id:'h2',t:'Take profit agli ostacoli',p:'pag. 21-22',st:[
  {s:'Non si chiude per paura. Si chiude a un **ostacolo** (roadblock): una zona contraria sulla tua strada.\n\nIl prezzo arriva all\'ostacolo e si forma rialzista-ribassista.',d:at(K.block,5,{live:true})},
  {s:'Ora decide l\'evidenza:',l:['**Rifiuto:** chiudi in profitto e cerca un nuovo ingresso.','**Rottura con chiusura:** mantieni.'],d:at(K.block,8),q:{q:'Sei in acquisto. All\'ostacolo una candela chiude sopra con forza. Cosa fai?',o:['Mantengo','Chiudo per paura','Inverto in vendita'],a:0,w:'Rottura confermata = mantieni. Il rifiuto, invece, sarebbe stato il segnale per il take profit.'}}
 ]},
 {id:'h3',t:'Almeno 2 a 1',p:'pag. 28',st:[
  {s:'Il take profit deve essere almeno il **doppio dello stop**. Se l\'ostacolo è a 30 pip e lo stop a 100, il trade non si fa.'},
  {s:'Facciamo i conti dell\'esempio: 5 vincenti da 30 pip fanno +150. 2 perdenti da 100 fanno -200. Vinci più spesso, ma il conto scende.',m:'Il 2:1 non basta da solo: conta anche la percentuale di vincita. Con 2:1 serve più del 33% di trade vincenti per guadagnare, costi esclusi.',q:{q:'Stop 80 pip, ostacolo a 120 pip. Il trade si fa?',o:['No, servono almeno 160 pip','Sì, è positivo','Sì, se la zona è settimanale'],a:0,w:'120 è solo 1,5 volte lo stop. Serve almeno il doppio.'}}
 ]},
 {id:'h4',t:'Stop sulla struttura',p:'pag. 22-23',st:[
  {s:'Lo stop sta dove la zona diventa **invalida**, non a una distanza casuale.\n\nUno stop appena sotto la zona è facile da colpire: il prezzo fa uno stoppino e poi riparte.',d:at(K.wick,5,{cap:'Stoppino sotto la zona, chiusura dentro: la zona regge'})},
  {s:'La regola: esci quando la candela H4 **chiude** sotto la zona H4. Per la zona H1, quando una candela chiude sotto.',d:at(K.closeb,3,{cap:'Chiusura sotto la zona: l\'idea è invalidata',live:true})},
  {s:'Questo è il punto più pericoloso dell\'ebook.',m:'Aspettare la chiusura H4 senza uno stop nel mercato significa che in caso di notizie o gap la perdita non ha limiti. Tieni sempre uno stop reale, oltre la zona e il rumore, e calcola il lotto su quella distanza. La chiusura H4 ti dice quando uscire prima, non sostituisce la protezione.',q:{q:'Candela H4 in corso, stoppino sotto la zona. Non ha ancora chiuso. Cosa fai?',o:['Aspetto la chiusura, con lo stop di protezione già nel mercato','Chiudo subito in panico','Sposto lo stop più lontano'],a:0,w:'Decide la chiusura. Lo stop di protezione resta fermo e non si allarga mai.'}}
 ]},
 {id:'h5',t:'Quando mantenere',p:'pag. 23-24',st:[
  {s:'Mantieni finché:',l:['Settimanale e giornaliero restano nella tua direzione.','Si formano nuovi supporti sopra il prezzo.','La zona del timeframe alto non è ancora stata raggiunta.'],m:'L\'ebook permette anche di aggiungere alla posizione dopo una rottura. Fallo solo con rischio totale sotto controllo. All\'inizio evitalo.'},
  {s:'Si chiude solo con una **prova** di inversione, non per paura o noia.',q:{q:'Sei in profitto di 30 pip, nessun ostacolo vicino, storyline intatta. Hai paura. Cosa fai?',o:['Mantengo: non c\'è una prova per uscire','Chiudo per sicurezza','Tolgo lo stop'],a:0,w:'La paura non è una prova. Decidono ostacoli e storyline.'}}
 ]}
]},
{id:'m8',t:'Abitudini da eliminare',d:'I quattro comportamenti che bruciano il conto.',ls:[
 {id:'i1',t:'Vendetta e leva',p:'pag. 27',st:[
  {s:'**Trading di vendetta:** dopo una perdita apri più grande per recuperare. Una perdita diventa due. La perdita è solo un\'informazione: chiudi il grafico.\n\n**Troppa leva:** "questa è perfetta, esagero". La terza volta perdi il 40% in un colpo.',m:'Una percentuale fissa di rischio è una delle regole migliori dell\'ebook. Molti usano l\'1% o meno. Il calcolatore nella scheda Strumenti ti aiuta.',q:{q:'Hai appena perso 200 pip e vuoi recuperare. Cosa fai?',o:['Chiudo il grafico e torno più tardi','Raddoppio il lotto','Tolgo lo stop dal trade successivo'],a:0,w:'Regola 9: niente trading dopo una perdita emotiva.'}}
 ]},
 {id:'i2',t:'Trade forzati e TP corti',p:'pag. 27-28',st:[
  {s:'**Trade forzati:** tre ore a guardare i grafici e alla fine "questa sembra abbastanza". Nessun setup = nessun trade. Stare fuori è una decisione.\n\n**TP 30, hold -200:** tagli i profitti e tieni le perdite. Vinci spesso e il conto scende.',q:{q:'Dopo tre ore non c\'è nessun setup valido. Cosa fai?',o:['Non opero','Abbasso i requisiti','Passo su M1 finché trovo qualcosa'],a:0,w:'Non operare quando non c\'è vantaggio è la scelta giusta.'}}
 ]}
]},
{id:'m9',t:'Il tuo piano',d:'Le 10 regole, il backtest, il diario.',ls:[
 {id:'j1',t:'Le 10 regole',p:'pag. 29-30',st:[
  {s:'Eccole riassunte. Le trovi sempre nella scheda Strumenti.',l:['Prima il timeframe più alto.','Ribassista-rialzista = supporto. Rialzista-ribassista = resistenza.','Segna le zone prima che il prezzo arrivi.','Tutte e tre le conferme, o niente.','La candela deve chiudere.','Taglia le perdite in base alla struttura.','TP agli ostacoli, mantieni sulle rotture.','Il timeframe superiore prevale.','Niente trading dopo una perdita emotiva.','Prima le zone nuove.'],m:'La regola 6 dice "chiude dentro la zona", ma pag. 23 dice "chiude sotto". Usa pag. 23: una candela può chiudere dentro e la zona reggere ancora.',q:{q:'Quale regola blocca l\'ingresso su un semplice stoppino oltre la resistenza?',o:['La candela deve chiudere','Prima le zone nuove','Niente trading dopo una perdita emotiva'],a:0,w:'Regola 5: la chiusura, non il tocco.'}}
 ]},
 {id:'j2',t:'Il backtest',p:'pag. 32',st:[

function chart(sp){

 const ys=[];(sp.c||[]).forEach(c=>ys.push(c[1],c[2]));(sp.p||[]).forEach(p=>ys.push(p[1]));(sp.lines||[]).forEach(l=>ys.push(l.y));(sp.zones||[]).forEach(z=>ys.push(z.y1,z.y2));
 (sp.marks||[]).forEach(k=>ys.push(k.y));const lo=Math.min(...ys)-4,hi=Math.max(...ys)+4,Y=v=>10+(H-20)*(1-(v-lo)/(hi-lo));
 const n=sp.n==null?(sp.c?sp.c.length:0):sp.n;
 const N=sp.c?n:(sp.np||99);const longest=Math.max(0,...(sp.lines||[]).map(l=>(l.t||'').length),...(sp.zones||[]).map(z=>(z.t||'').length));
 const strip=sp.c?Math.min(120,longest*6.4+8):0,plotW=W-strip-4;
 const X=sp.c?(i=>4+plotW/sp.c.length*(i+.5)):(v=>4+(W-8)*v/100);
 const xa=(l,d)=>sp.c?X(l.a==null?0:l.a):X(l.a==null?0:l.a);
 const xb=l=>sp.c?(l.b==null||l.b>=sp.c.length-1.5?W-2:X(l.b)):(l.b==null?W-2:X(l.b));
 (sp.zones||[]).forEach(z=>{if(z.at&&z.at>N)return;
  const x1=sp.c?X(z.a||0)-10:X(z.x1),x2=sp.c?W-2:X(z.x2);
  el('rect',{x:x1,y:Y(z.y2),width:x2-x1,height:Y(z.y1)-Y(z.y2),fill:COL[z.k]||COL.y,opacity:z.k==='y'?.55:.13},svg);
  if(z.t)txt(svg,sp.c?x2-3:x1+5,Y(z.y2)+15,z.t,{'text-anchor':sp.c?'end':'start','font-size':14,'font-weight':700,fill:z.k==='y'?'#1c2840':COL[z.k]});
 });
 (sp.lines||[]).forEach(l=>{if(l.at&&l.at>N)return;
  const x1=xa(l),x2=xb(l),c=COL[l.k]||COL.i;
  el('line',{x1,x2,y1:Y(l.y),y2:Y(l.y),stroke:c,'stroke-width':1.6},svg);
  if(l.t)txt(svg,x2-1,Y(l.y)-4,l.t,{'text-anchor':'end',fill:c,'font-weight':700,'font-size':14});
 });
 const pp=sp.p?sp.p.slice(0,sp.np||sp.p.length):null;
 if(sp.p){el('polyline',{points:pp.map(p=>X(p[0])+','+Y(p[1])).join(' '),fill:'none',stroke:'#1c2840','stroke-width':2,'stroke-linejoin':'round'},svg)}
 (sp.marks||[]).forEach(k=>{if(sp.np&&k.at>sp.np)return;txt(svg,X(k.x),Y(k.y),k.t,{'text-anchor':'middle','font-weight':700,'font-size':16,fill:'#cf2e2a'})});
 const live=[];
 if(sp.c){const cw=Math.min(34,plotW/sp.c.length*.62);
  sp.c.slice(0,n).forEach((c,i)=>{const g=el('g',{},svg),x=X(i);
   const w=el('line',{x1:x,x2:x,stroke:'#1c2840','stroke-width':2},g),b=el('rect',{x:x-cw/2,width:cw,'stroke-width':2},g);
   const set=(o,h,l,p)=>{const up=p>=o;w.setAttribute('y1',Y(h));w.setAttribute('y2',Y(l));
    b.setAttribute('y',Y(Math.max(o,p)));b.setAttribute('height',Math.max(2,Math.abs(Y(o)-Y(p))));
    b.setAttribute('fill',up?'#fff':'#1c2840');b.setAttribute('stroke',up?COL.g:'#1c2840');w.setAttribute('stroke',up?COL.g:'#1c2840')};
   set(c[0],c[1],c[2],c[3]);if(i===n-1&&sp.live)live.push({c,set});
  })}
 if(sp.cap){const p=document.createElement('p');p.className='cap';p.textContent=sp.cap;wrap.appendChild(p)}
 if(live.length){const go=()=>playCandle(live[0]);
  const b=document.createElement('button');b.className='replay';b.textContent='Rivedi la candela';b.onclick=go;wrap.appendChild(b);setTimeout(go,260)}

function playCandle(L){const [o,h,l,c]=L.c;const way=c>=o?[o,l,h,c]:[o,h,l,c];

 const f=t=>{const u=Math.max(0,Math.min(1,(t-t0)/T)),s=u*3,k=Math.min(2,Math.floor(s)),r=s-k,p=way[k]+(way[k+1]-way[k])*r;
  hi=Math.max(hi,p);lo=Math.min(lo,p);L.set(o,hi,lo,p);if(u<1)requestAnimationFrame(f)};
 L.tok=(L.tok||0)+1;requestAnimationFrame(f)}

 {t:'Sei in acquisto dalla zona H4. Una candela H4 ha chiuso, con uno stoppino sotto la zona e il corpo dentro.',d:at(K.wick,3),a:'hold',w:'Uno stoppino sotto la zona è normale: la candela non ha chiuso sotto.'},
 {t:'Sei in acquisto dalla zona H4. La candela H4 ha appena chiuso sotto la zona.',d:at(K.closeb,3),a:'loss',w:'La chiusura sotto la zona invalida l\'idea. Si esce.'},
 {t:'Sei in acquisto. Il prezzo è arrivato all\'ostacolo e si è formata rialzista-ribassista.',d:at(K.block,5),a:'win',w:'Rifiuto all\'ostacolo: si chiude in profitto e si cerca un nuovo ingresso.'},
 {t:'Sei in acquisto. All\'ostacolo una candela ha chiuso sopra con forza.',d:at(K.block,7),a:'hold',w:'Rottura confermata: si mantiene.'},
 {t:'Sei a +30 pip. Nessun ostacolo vicino, storyline intatta. Hai paura di restituire tutto.',a:'hold',w:'La paura non è una prova. L\'ebook mette in guardia proprio da questo errore.'},
 {t:'Sei in acquisto e in profitto. Il giornaliero ha cambiato storyline: ora è ribassista.',a:'win',w:'La storyline è cambiata: hai la prova di cui parlava il metodo. Si chiude.'},
 {t:'Il prezzo sale. Sopra si è appena formato un nuovo supporto, settimanale e giornaliero restano rialzisti.',a:'hold',w:'Nuovo SNR e storyline intatta: si mantiene.'},
 {t:'Sei in perdita di 50 pip. La candela H4 è ancora aperta e il prezzo è dentro la zona.',a:'hold',w:'La zona è valida finché non chiude sotto. Il tuo stop di protezione resta dov\'è.'}
];
function mgmt(){const k=pick(MG);const b=div(`<h2>Simulatore di gestione</h2><p style="margin-top:8px">${k.t}</p>`);if(k.d)charts(k.d,b);
 const res=div(''),opts=div('');[['hold','Mantengo'],['win','Chiudo in profitto'],['loss','Chiudo in perdita']].forEach(([v,t])=>{const o=$(`<button class="opt">${t}</button>`);
  o.onclick=()=>{const ok=v===k.a;opts.innerHTML='';res.appendChild($(`<div class="why ${ok?'ok':'no'}">${ok?'Giusto.':'Non proprio.'} ${k.w}</div>`));const nx=$(`<button class="btn" style="margin-top:12px">Nuovo caso</button>`);nx.onclick=mgmt;res.appendChild(nx)};opts.appendChild(o)});
 b.appendChild(opts);b.appendChild(res);shell('#/train',b)}
function flash(){let a=shuffle(GLOSS),i=0,sh=false;
 const draw=()=>{const b=div(`<h2>Schede</h2><p class="muted small">Scheda ${i+1} di ${a.length}. Tocca per girarla.</p>`);
  const c=$(`<button class="flash">${sh?`<span class="a">${a[i][1]}</span>`:`<span class="w">${a[i][0]}</span>`}</button>`);c.onclick=()=>{sh=!sh;draw()};b.appendChild(c);
  const nx=$(`<button class="btn">Prossima scheda</button>`);nx.onclick=()=>{i=(i+1)%a.length;sh=false;draw()};b.appendChild(nx);shell('#/train',b)};draw()}

const RULES=['Prima il timeframe più alto: spiega il mercato in una frase.','Ribassista-rialzista = supporto. Rialzista-ribassista = resistenza.','Segna le zone prima che il prezzo arrivi.','Tutte e tre le conferme, o niente.','La candela deve chiudere: gli stoppini non contano.','Taglia le perdite in base alla struttura, non alle emozioni.','TP agli ostacoli, mantieni sulle rotture confermate.','Il timeframe superiore ha l\'ultima parola.','Niente trading dopo una perdita emotiva.','Prima le zone nuove.'];
function tools(){const b=div(`<h2>Strumenti</h2><div class="sp"></div>`);
 [['#/calc','Calcolatore del rischio','Lotto e rapporto rischio-rendimento.'],['#/check','Lista di controllo','Tutti i punti prima del trade.'],['#/rules','Le 10 regole','Da rileggere ogni mattina.'],['#/bt','Contatore del backtest','Obiettivo: 50 esempi per concetto.'],['#/diary',"Diario dei trade",S.diary.length?`${S.diary.length} trade registrati.`:'Annota ogni trade e guarda i numeri.']].forEach(([h,t,d])=>{const c=$(`<button class="card"><b>${t}</b><span class="muted small">${d}</span></button>`);c.onclick=()=>go(h);b.appendChild(c)});shell('#/tools',b)}
function field(id,l,v){return `<label class="fld"><span>${l}</span><input id="${id}" type="number" inputmode="decimal" value="${v}"></label>`}
function calc(){const c=S.calc||{bal:1000,r:1,sl:100,tp:200,pv:10};
 const b=div(`<h2>Calcolatore del rischio</h2><div class="sp"></div>${field('bal','Saldo del conto ($)',c.bal)}${field('r','Rischio per trade (%)',c.r)}${field('sl','Stop (pip)',c.sl)}${field('tp','Take profit (pip)',c.tp)}${field('pv','Valore di 1 pip per 1 lotto ($)',c.pv)}<div id="out"></div><p class="small muted">Controlla il valore del pip sul tuo broker: sull'oro cambia. Con 10 $ e 0,1 lotti, 200 pip valgono 200 $, come nell'esempio dell'ebook.</p>`);
 const out=b.querySelector('#out');const up=()=>{const g=i=>+b.querySelector('#'+i).value||0,v={bal:g('bal'),r:g('r'),sl:g('sl'),tp:g('tp'),pv:g('pv')};S.calc=v;save();
  const risk=v.bal*v.r/100,lot=v.sl&&v.pv?risk/(v.sl*v.pv):0,rr=v.sl?v.tp/v.sl:0;
  out.innerHTML=`<div class="rows"><div><span>Rischio</span><b>${risk.toFixed(2)} $</b></div><div><span>Lotto</span><b>${(Math.floor(lot*100)/100).toFixed(2)}</b></div><div><span>Rapporto</span><b>${rr.toFixed(2)}:1</b></div></div><p class="note">${rr>=2?'Il rapporto rispetta il minimo di 2:1.':'Sotto 2:1: il trade non si fa.'}${v.r>2?' Il rischio supera il 2% per trade: è alto.':''}</p>`};
 b.querySelectorAll('input').forEach(i=>i.oninput=up);up();shell('#/tools',b)}
function check(){const items=['Settimanale e giornaliero sono allineati','So spiegare il mercato in una frase','La zona nasce da due candele nell\'ordine giusto','Settimanale, giornaliero e H4 indicano la stessa zona','La zona è fresca','Conferma 1: rifiuto','Conferma 2: nuovo SNR','Conferma 3: chiusura oltre il livello','Sono entrato sul pullback','Il primo ostacolo è ad almeno il doppio dello stop','Lo stop è nel mercato e il rischio è fisso','Sono calmo: non è un trade di vendetta'];
 const b=div(`<h2>Lista di controllo</h2><p class="muted small" style="margin-top:6px">Se ne manca uno, niente trade.</p><div id="chk"></div>`),host=b.querySelector('#chk');
 const paint=()=>{host.innerHTML='';items.forEach((t,i)=>{const r=$(`<button class="chk"><span class="box ${S.chk[i]?'ok':''}"></span><span>${t}</span></button>`);r.onclick=()=>{S.chk[i]=!S.chk[i];save();paint()};host.appendChild(r)});
  const n=items.filter((_,i)=>S.chk[i]).length;host.appendChild($(`<p class="note">${n===items.length?'Tutti i punti sono spuntati: il setup rispetta il metodo.':`${n} su ${items.length}: niente trade.`}</p>`));
  const c=$(`<button class="btn alt">Azzera la lista</button>`);c.onclick=()=>{S.chk={};save();paint()};host.appendChild(c)};paint();shell('#/tools',b)}
function rules(){const b=div(`<h2>Le 10 regole</h2><ol class="rl">${RULES.map(r=>`<li>${r}</li>`).join('')}</ol>`);shell('#/tools',b)}
function bt(){const names=[['snr','Formazioni SNR'],['rbs','RBS e SBR'],['qm','QM'],['c3','Sequenze con 3 conferme']];
 const b=div(`<h2>Contatore del backtest</h2><p class="muted small" style="margin-top:6px">Conta gli esempi trovati, anche quelli falliti.</p><div id="h"></div>`),h=b.querySelector('#h');
 const paint=()=>{h.innerHTML='';names.forEach(([k,t])=>{const v=S.bt[k]||0,r=$(`<div class="ct"><div><b>${t}</b><div class="bar"><i style="width:${Math.min(100,v*2)}%"></i></div></div><button class="mm" aria-label="Togli uno">-</button><span>${v}/50</span><button class="mm" aria-label="Aggiungi uno">+</button></div>`);const q=r.querySelectorAll('.mm');q[0].onclick=()=>{S.bt[k]=Math.max(0,v-1);save();paint()};q[1].onclick=()=>{S.bt[k]=v+1;save();paint()};h.appendChild(r)})};paint();shell('#/tools',b)}
function diary(){const b=div(`<h2>Diario dei trade</h2><div id="st"></div><div class="sp"></div>
 <label class="fld"><span>Strumento e zona</span><input id="z" type="text" placeholder="XAUUSD, zona H4 fresca"></label>
 <label class="fld"><span>Direzione</span><select id="dir"><option>Acquisto</option><option>Vendita</option></select></label>
 <label class="fld"><span>Risultato in R</span><input id="r" type="number" inputmode="decimal" step="0.1" placeholder="2 oppure -1"></label>
 <label class="fld"><span>Note</span><input id="n" type="text" placeholder="Conferme, errori, emozioni"></label>
 <button class="btn" id="add">Salva il trade</button><div class="sp"></div><div id="ls"></div>`);
 const paint=()=>{const d=S.diary,w=d.filter(x=>x.r>0).length,sum=d.reduce((a,x)=>a+x.r,0);
  b.querySelector('#st').innerHTML=d.length?`<div class="rows"><div><span>Trade</span><b>${d.length}</b></div><div><span>Vincenti</span><b>${Math.round(w/d.length*100)}%</b></div><div><span>Totale</span><b>${sum.toFixed(1)} R</b></div><div><span>Media per trade</span><b>${(sum/d.length).toFixed(2)} R</b></div></div>`:'<p class="muted" style="margin-top:8px">Nessun trade ancora. Dopo 30 trade i numeri iniziano a dirti qualcosa.</p>';
  const ls=b.querySelector('#ls');ls.innerHTML='';d.slice().reverse().forEach(x=>{const r=$(`<div class="gl"><b>${x.date}: ${x.dir}, ${x.r} R</b></div>`);r.appendChild(document.createTextNode(x.z+(x.n?'. '+x.n:'')));const del=$(`<button class="link small" style="display:block;margin-top:4px">Elimina</button>`);del.onclick=()=>{S.diary=S.diary.filter(y=>y!==x);save();paint()};r.appendChild(del);ls.appendChild(r)})};
 b.querySelector('#add').onclick=()=>{const g=i=>b.querySelector('#'+i).value,r=parseFloat(g('r'));if(isNaN(r)){b.querySelector('#r').focus();return}S.diary.push({date:new Date().toLocaleDateString('it-IT'),z:g('z')||'Zona non indicata',dir:g('dir'),r,n:g('n')});save();['z','r','n'].forEach(i=>b.querySelector('#'+i).value='');paint()};paint();shell('#/tools',b)}
function gloss(){const b=div(`<h2>Glossario</h2><input type="search" placeholder="Cerca un termine" aria-label="Cerca un termine"><div id="g"></div><div class="sp"></div>`);
 const g=b.querySelector('#g'),inp=b.querySelector('input');
 const paint=()=>{const q=inp.value.toLowerCase();g.innerHTML=GLOSS.filter(x=>(x[0]+x[1]).toLowerCase().includes(q)).map(x=>`<div class="gl"><b>${x[0]}</b>${x[1]}</div>`).join('')||'<p class="muted">Nessun termine trovato. Prova con una sigla, come DOL.</p>'};inp.oninput=paint;paint();
 const m=$(`<button class="btn alt">Pagine del libro e lezioni</button>`);m.onclick=()=>go('#/map');b.appendChild(m);
 const r=$(`<button class="btn alt" style="margin-top:10px">Azzera i progressi</button>`);let arm=false;r.onclick=()=>{if(!arm){arm=true;r.textContent='Tocca di nuovo per azzerare tutto';return}S={done:{},pos:{},wrong:{},sim:{n:0,ok:0},chk:{},open:'m0',diary:[],bt:{}};save();go('#/')};b.appendChild(r);
 shell('#/gloss',b)}
function bookmap(){const b=div(`<h2>Pagine del libro</h2><p class="muted small" style="margin-top:6px">Tocca una riga per aprire la lezione che spiega quelle pagine.</p>`);
 BOOKMAP.forEach(([p,t,id])=>{const r=$(`<button class="gl" style="display:block;width:100%;text-align:left"><b>Pag. ${p}</b>${t}</button>`);r.onclick=()=>go('#/l/'+id+'/0');b.appendChild(r)});shell('#/gloss',b)}

function route(){const h=R,p=h.split('/');
 if(p[1]==='l')return lesson(p[2],+p[3]||0);if(p[1]==='fine')return fine(p[2]);
 if(p[1]==='train')return train();if(p[1]==='sim')return sim();if(p[1]==='mgmt')return mgmt();if(p[1]==='calc')return calc();if(p[1]==='check')return check();if(p[1]==='rules')return rules();if(p[1]==='bt')return bt();if(p[1]==='diary')return diary();if(p[1]==='flash')return flash();
 if(p[1]==='review')return review();
 if(p[1]==='exam')return runQ(shuffle(allQ()).slice(0,15),'Esame generale','#/train');
 if(p[1]==='tools')return tools();if(p[1]==='gloss')return gloss();if(p[1]==='map')return bookmap();
 home()}
route();

</script>
</body></html>
