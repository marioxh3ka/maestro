:root{--paper:#f6f7f2;--grid:#d5e1ec;--ink:#1c2840;--soft:#566177;--red:#cf2e2a;--green:#16805a;--hi:#ffe75e;--blue:#2c62b8;--white:#fff;--m:30px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none;background:var(--paper);color:var(--ink);font:400 17px/1.5 Body,sans-serif}
#app{height:100%;display:flex;flex-direction:column}
.page{flex:1;overflow-y:auto;padding:18px 16px 28px calc(var(--m) + 12px);background-color:var(--paper);
 background-image:linear-gradient(90deg,transparent calc(var(--m) - 1px),#e58b86 calc(var(--m) - 1px),#e58b86 var(--m),transparent var(--m)),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
 background-size:100% 100%,20px 20px,20px 20px;background-attachment:local}
h1,h2,h3{font-family:Head,sans-serif;line-height:1.12;margin:0;letter-spacing:-.01em}
h1{font-size:36px;font-weight:800}h2{font-size:25px;font-weight:700}h3{font-size:19px;font-weight:700}
p{margin:0 0 12px}.step ul{margin:6px 0 12px;padding-left:20px}.step li{margin-bottom:7px}
.muted{color:var(--soft)}.small{font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tabs{padding-bottom:env(safe-area-inset-bottom,0px);display:flex;background:var(--white);border-top:2px solid var(--ink)}
.tabs button{flex:1;padding:11px 2px 12px;font:700 14px Body;color:var(--soft)}
.tabs button.on{color:var(--red);box-shadow:inset 0 3px 0 var(--red)}
.btn{display:block;width:100%;padding:14px 16px;background:var(--ink);color:#fff;font-weight:700;border-radius:4px;text-align:center}
.btn[disabled]{background:#b9c0cc}.btn.alt{background:var(--white);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.hero{margin-bottom:18px}.hero .sum{margin:8px 0 14px}
.mod{margin-bottom:6px;background:rgba(255,255,255,.72);box-shadow:inset 0 -1px 0 var(--grid)}
.mod>button{display:flex;gap:10px;width:100%;text-align:left;padding:12px 8px;align-items:baseline}
.mod .n{font:700 22px Hand;color:var(--red);min-width:26px}.mod .c{margin-left:auto;font-size:14px;color:var(--soft);white-space:nowrap}
.mod .d{display:block;font-size:14px;color:var(--soft);font-weight:400}
.ls{display:flex;gap:10px;width:100%;padding:9px 8px 9px 12px;text-align:left;align-items:center}
.box{flex:none;width:21px;height:21px;border:2px solid var(--ink);background:#fff;border-radius:2px;position:relative}
.box.ok::after{content:"";position:absolute;left:5px;top:-5px;width:8px;height:18px;border:solid var(--red);border-width:0 3px 3px 0;transform:rotate(40deg)}
.top{display:flex;align-items:center;gap:12px;padding:9px 14px;background:var(--white);border-bottom:2px solid var(--ink)}
.top .x{font:700 22px Body;width:30px;height:30px}.bar{flex:1;height:6px;background:var(--grid);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red)}
.top .pg{font:700 15px Hand;color:var(--soft);white-space:nowrap}
.foot{display:flex;gap:10px;padding:10px 14px;background:var(--white);border-top:2px solid var(--ink)}.foot .btn.alt{width:38%}
.step h2{margin-bottom:12px}
.note{font:400 18px/1.32 Hand,cursive;color:var(--red);margin:14px 0;padding-left:12px;border-left:3px solid var(--red)}
mark{background:var(--hi);color:inherit;padding:0 2px}
.chart{margin:12px 0 4px}.chart svg{display:block;width:100%;height:auto;overflow:visible}
.cap{font:400 16px Hand;color:var(--soft);margin:0 0 8px}
.replay{font:700 15px Hand;color:var(--blue);padding:2px 0 8px}
.q{margin-top:16px;padding-top:12px;border-top:2px dashed var(--ink)}.q h3{margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;padding:12px;margin-bottom:9px;background:#fff;box-shadow:inset 0 0 0 2px var(--ink);border-radius:4px}
.opt.ok{box-shadow:inset 0 0 0 3px var(--green);color:var(--green);font-weight:700}
.opt.no{box-shadow:inset 0 0 0 2px var(--red);color:var(--red);text-decoration:line-through}
.why{font:400 18px/1.32 Hand;margin-top:8px}.why.ok{color:var(--green)}.why.no{color:var(--red)}
.card{display:block;width:100%;text-align:left;background:#fff;padding:14px;margin-bottom:12px;box-shadow:inset 0 0 0 2px var(--ink);border-radius:4px}
.card b{font-family:Head;font-size:19px;display:block;margin-bottom:2px}
.rows{margin:10px 0}.rows div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--grid)}.rows b{text-align:right}
.done{text-align:center;padding-top:40px}.stamp{display:inline-block;font:700 42px Hand;color:var(--red);transform:rotate(-6deg);border:3px solid var(--red);border-radius:8px;padding:0 18px;margin-bottom:18px}
input[type=search]{width:100%;font:inherit;padding:11px;border:2px solid var(--ink);border-radius:4px;background:#fff;margin:12px 0}
.gl{padding:9px 0;border-bottom:1px solid var(--grid)}.gl b{display:block}
.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:#fff;box-shadow:inset 0 0 0 2px var(--ink);border-radius:4px;padding:18px;margin:14px 0;width:100%}
.flash .w{font:700 30px Head}.flash .a{font-size:18px}
.chk{display:flex;gap:10px;width:100%;text-align:left;padding:10px 0;align-items:flex-start;border-bottom:1px solid var(--grid)}
.clock{display:flex;gap:18px;margin:10px 0 2px}.clock div{flex:1}.clock b{font:800 32px Head;display:block}
.sp{height:14px}.link{color:var(--blue);font-weight:700;text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function flip(ch){
  const sw={CRH:'CRL',CRL:'CRH'};
  const m=y=>100-y;
  const o=Object.assign({},ch);
  if(ch.c) o.c=ch.c.map(c=>[m(c[0]),m(c[2]),m(c[1]),m(c[3])]);
  if(ch.p) o.p=ch.p.map(p=>[p[0],m(p[1])]);
  if(ch.lines) o.lines=ch.lines.map(l=>Object.assign({},l,{y:m(l.y),t:sw[l.t]||l.t}));
  if(ch.zones) o.zones=ch.zones.map(z=>Object.assign({},z,{y1:m(z.y2),y2:m(z.y1)}));
  return o;
}
function at(ch,n,extra){return Object.assign({},ch,{n},extra||{});}

  {s:'Ciao, sono il tuo maestro di **Candle Range Theory**. Ti spiego tutti i concetti del libro *The 1% Albania CRT Secrets* un passo alla volta. Non è la traduzione parola per parola: è una spiegazione in italiano, con parole e disegni miei.\n\nOgni lezione dura pochi minuti. Leggi, guarda il disegno sul quaderno, rispondi alla domanda. Finché non rispondi bene non si va avanti.'},
  {s:'Il libro ha **150 pagine**, quasi tutte grafici con poche parole, e i capitoli non sono in ordine di difficoltà: alcuni argomenti partono dal punto 2, altri sono ripetuti.\n\nPer questo ho rimesso tutto in ordine: dalle basi al piano completo. In ogni lezione trovi il numero di pagina, così puoi aprire il PDF e confrontare.',m:'Dove il libro mostra solo un disegno senza spiegarlo, te lo dico chiaramente: quella è una mia lettura, non una regola scritta.'},
  {s:'Tre cose da tenere sempre a mente:',l:['Il libro è a scopo educativo, non è consulenza finanziaria.','Nessuna strategia funziona sempre: il trading comporta il rischio reale di perdere denaro.','Prima di usare un modello con soldi veri, provalo su storico e su conto demo. Te lo insegno nell\'ultimo modulo.'],q:{q:'Qual è il modo giusto di usare questo corso?',o:['Seguirlo in ordine e controllare i modelli su storico e in demo','Saltare subito all\'ultimo modulo e operare con soldi veri','Imparare a memoria i disegni e applicarli senza test'],a:0,w:'L\'ordine serve: ogni modulo usa quello precedente. E un modello diventa tuo solo dopo averlo testato.'}}
 ]},
 {id:'l02',t:'Com\'è fatta una candela',p:'prerequisito',st:[
  {s:'Ogni candela racconta quattro prezzi: **apertura** (Open), **massimo** (High), **minimo** (Low) e **chiusura** (Close). Da qui la sigla OHLC.\n\nIl rettangolo è il **corpo**: va da apertura a chiusura. I fili sopra e sotto sono gli **stoppini** (wick).',d:at(K.anat,1,{cap:'Candela rialzista: chiude più in alto di dove ha aperto'})},
  {s:'Guarda come si forma, non solo com\'è finita. Una candela rialzista può scendere prima, salire e tornare un po\' indietro. Lo stoppino è il **segno lasciato da un prezzo toccato e rifiutato**.\n\nPremi "Rivedi" sul disegno per vedere il movimento dal vivo.',d:at(K.anat,2,{live:true,cap:'Candela ribassista: chiude più in basso di dove ha aperto'})},
  {s:'L\'intervallo tra massimo e minimo si chiama **range**. Per la CRT il range è più importante del colore: tutta la teoria parla di cosa fa il prezzo rispetto a quei due estremi.',q:{q:'Una candela H4 apre a 2000, sale a 2010, scende a 1990 e chiude a 2005. Qual è il suo range?',o:['Da 1990 a 2010','Da 2000 a 2005','Da 2000 a 2010'],a:0,w:'Il range va dal minimo al massimo, stoppini compresi: 1990-2010. 2000-2005 è solo il corpo.'}}
 ]},
 {id:'l03',t:'Cos\'è la liquidità',p:'prerequisito',st:[
  {s:'Sopra un massimo evidente ci sono stop di chi è short e ordini di chi aspetta la rottura. Sotto un minimo evidente, il contrario.\n\nQuesti gruppi di ordini sono la **liquidità**. L\'idea della CRT è che il prezzo venga attirato da questi punti.',d:{p:[[0,30],[12,62],[22,44],[34,70],[46,48],[58,70],[70,40],[82,62],[100,76]],lines:[{y:70,a:30,b:100,t:'Massimi uguali: stop qui sopra',k:'r'},{y:40,a:60,b:100,t:'Minimo: stop qui sotto',k:'r'}]}},
  {s:'Tre parole che incontrerai sempre:',l:['**Purge** o **sweep**: il prezzo va oltre un livello, prende gli ordini e torna indietro.','**Draw on Liquidity (DOL)**: il livello verso cui ci aspettiamo che il prezzo si muova.','**Turtle soup**: finta rottura di un massimo o minimo, che intrappola chi entra sulla rottura.']},
  {s:'Attenzione: non sappiamo davvero dove siano gli ordini degli altri, né chi muove il prezzo.',m:'"Liquidità" e "manipolazione" sono un modello per leggere il grafico, non un fatto dimostrato. Serve finché ti aiuta a prendere decisioni che poi puoi misurare.',q:{q:'Il prezzo buca un minimo evidente con lo stoppino e chiude di nuovo sopra. Come si chiama?',o:['Purge (o sweep) della liquidità','Continuazione del trend','Inside bar'],a:0,w:'È andato oltre il livello, ha preso gli ordini e non ha accettato quel prezzo: è un purge.'}}
 ]},
 {id:'l04',t:'HTF e LTF',p:'pag. 79-80',st:[
  {s:'**HTF** significa timeframe alto (giornaliero, H4). **LTF** significa timeframe basso (M15, M5, M1).\n\nLa regola di base del libro: il timeframe alto dà la direzione, quello basso dà l\'ingresso.'},
  {s:'Il libro accoppia i timeframe così. A sinistra leggi la CRT, a destra cerchi l\'entrata:',l:['Settimanale con H4','Giornaliero con H1','H4 con M15','H1 con M5','M30 con M3','M15 con M1'],m:'Tu lavori su M15 e M1: è la coppia dell\'ultima riga. Vuol dire che la candela CRT va letta su M15 e l\'ingresso cercato su M1.'},
  {s:'Il libro propone anche uno schema a tre livelli:',l:['**1H** per il bias, cioè la direzione attesa','**30M** per la struttura','**5M** per l\'ingresso'],q:{q:'Vuoi leggere una CRT sulla candela H4. Su quale timeframe cerchi l\'ingresso, secondo il libro?',o:['M15','H1','Settimanale'],a:0,w:'La coppia è H4 con M15. Il settimanale si legge invece con H4.'}}
 ]}
]},
{id:'m1',t:'Il cuore della CRT',d:'Le tre candele: generazione, purge, neutralizzazione.',ls:[
 {id:'l11',t:'Ogni candela è un range',p:'pag. 3, 103-104',st:[
  {s:'CRT sta per **Candle Range Theory**: teoria del range della candela.\n\nL\'idea è semplice. Prendi una candela di qualsiasi timeframe e segna il suo massimo e il suo minimo. Quei due livelli diventano la tua mappa.',d:at(K.classic,1,{cap:'CRH = massimo del range. CRL = minimo del range.'})},
  {s:'**CRH** è il Candle Range High, **CRL** il Candle Range Low.\n\nFinita la candela, si è creata liquidità su entrambi i lati: sopra il massimo e sotto il minimo. Il libro chiama questa prima candela **generazione della liquidità**.',q:{q:'Cosa rappresenta il CRL?',o:['Il minimo della candela di range','Il prezzo di chiusura della candela','La media delle ultime tre candele'],a:0,w:'CRL = Candle Range Low: il minimo, stoppino compreso, della candela che fa da range.'}}
 ]},
 {id:'l12',t:'Le tre fasi',p:'pag. 104-106',st:[
  {s:'**Candela 1, generazione.** Si forma il range. Ora c\'è un obiettivo vicino e uno lontano: il libro parla di DOL di breve e di lungo termine.',d:at(K.classic,1,{cap:'Candela 1: nasce il range'})},
  {s:'**Candela 2, purge.** Il prezzo esce da un lato del range, prende quella liquidità e **rientra**. Questa è la trappola: chi era entrato sulla rottura ora è dalla parte sbagliata.',d:at(K.classic,2,{live:true,cap:'Candela 2: esce sotto il CRL e rientra'})},
  {s:'**Candela 3, neutralizzazione.** Il prezzo corre verso il lato opposto del range e prende anche quella liquidità. Il libro la chiama neutralizzazione.',d:at(K.classic,3,{live:true,cap:'Candela 3: raggiunge il CRH'})},
  {s:'Riconosci lo schema? È lo stesso di accumulazione, manipolazione e distribuzione, che ritroveremo nella Quarterly Theory.',l:['Candela 1 = accumulazione','Candela 2 = manipolazione','Candela 3 = distribuzione'],m:'L\'abbinamento è mio, per aiutarti a ricordare. Il libro usa i tre nomi separatamente.',q:{q:'Qual è il compito della candela 2?',o:['Prendere la liquidità da un lato e rientrare nel range','Formare il range iniziale','Raggiungere l\'obiettivo finale'],a:0,w:'La candela 2 è il purge: esce, prende gli ordini, rientra. L\'obiettivo arriva con la candela 3.'}}
 ]},
 {id:'l13',t:'CRT rialzista, passo per passo',p:'pag. 5, 47-48',st:[
  {s:'Facciamolo insieme. Il mercato è rialzista e sei su un livello importante. Si chiude questa candela: segna CRH e CRL.\n\nAdesso **non fai niente**. Aspetti.',d:at(K.classic,1)},
  {s:'Arriva la candela 2. Scende sotto il CRL e prende la liquidità. Molti vendono qui, convinti della rottura.\n\nGuarda dove chiude: **sopra il CRL**, di nuovo dentro il range. Il purge è confermato.',d:at(K.classic,2,{live:true})},
  {s:'Solo adesso puoi cercare un acquisto, scendendo di timeframe per trovare l\'ingresso. L\'obiettivo è il **CRH**.',d:at(K.classic,3,{live:true}),q:{q:'In una CRT rialzista classica, dove sta l\'obiettivo?',o:['Sul CRH, il massimo del range','Sul CRL, il minimo del range','Sul minimo della candela 2'],a:0,w:'Il purge avviene sotto, quindi il prezzo è atteso sul lato opposto: il CRH.'}}
 ]},
 {id:'l14',t:'CRT ribassista',p:'pag. 47, 49',st:[
  {s:'È lo specchio esatto. La candela 2 sale sopra il CRH, prende la liquidità e chiude dentro il range.',d:at(flip(K.classic),2,{live:true})},
  {s:'La candela 3 scende fino al CRL.',d:at(flip(K.classic),3,{live:true}),q:{q:'La candela 2 supera il CRH con lo stoppino e chiude dentro il range. Cosa cerchi?',o:['Una vendita con obiettivo CRL','Un acquisto con obiettivo CRH','Niente: un purge sopra è sempre rialzista'],a:0,w:'Purge sopra il massimo e rientro: si cerca il lato opposto, quindi vendita verso il CRL.'}}
 ]},
 {id:'l15',t:'Purge o vera rottura?',p:'pag. 94-99',st:[
  {s:'Questo è il punto che salva più operazioni. Stesso inizio, finale opposto.\n\nA sinistra la candela esce sotto e **rientra**: stoppino, cioè purge. A destra **chiude fuori**: quella è una rottura, non un purge.',d:[{c:[[70,74,34,38],[38,50,24,44]],lines:[{y:34,a:0,b:1.7,t:'CRL',k:'i'}],cap:'Chiude dentro: purge'},{c:[[70,74,34,38],[38,42,12,16]],lines:[{y:34,a:0,b:1.7,t:'CRL',k:'i'}],cap:'Chiude fuori: rottura'}]},
  {s:'La regola da ricordare: **conta la chiusura**. Finché la candela non ha chiuso, non sai quale dei due casi hai davanti.',m:'Entrare mentre lo sweep è in corso è il modo più rapido di farsi colpire lo stop. Aspetta la chiusura della candela.',q:{q:'Sei su H4. A metà candela il prezzo è sotto il CRL. Cosa fai?',o:['Aspetto la chiusura della candela H4','Compro subito perché è un purge','Vendo subito perché è una rottura'],a:0,w:'A metà candela non sai ancora se è purge o rottura. Decide la chiusura.'}}
 ]}
]},
{id:'m2',t:'I modelli CRT',d:'Le sei forme del libro e la variante rara.',ls:[
 {id:'l21',t:'CRT a due candele',p:'pag. 6, 50-52',st:[
  {s:'Qui purge ed espansione avvengono **dentro la stessa candela**. La candela 2 scende sotto il CRL, rientra e arriva subito all\'obiettivo.\n\nIl libro la definisce aggressiva.',d:at(K.two,2,{live:true})},
  {s:'Secondo il libro compare soprattutto con le notizie, oppure quando il prezzo accelera prima di un orario chiave.',m:'Si riconosce bene dopo, molto meno mentre si forma. Quando la vedi completa, l\'ingresso è spesso già passato. Non inseguirla.',q:{q:'Cosa distingue la CRT a due candele dalla classica?',o:['Il prezzo arriva all\'obiettivo già nella candela 2','Non c\'è nessun purge','Il range si forma su due candele'],a:0,w:'Il purge c\'è sempre. La differenza è che l\'espansione finisce nella candela 2.'}}
 ]},
 {id:'l22',t:'CRT a più candele',p:'pag. 7, 39-41',st:[
  {s:'È simile alla classica, ma l\'espansione **richiede più candele** per arrivare all\'obiettivo. Dopo il purge il prezzo sale con fatica, a tratti.',d:at(K.multi,6)},
  {s:'Il libro la etichetta **LP**, a bassa probabilità. Compare spesso nei movimenti contro trend, nel passaggio da liquidità esterna a interna (ERL-IRL) oppure nella sessione pomeridiana.',q:{q:'Come classifica il libro la CRT a più candele?',o:['Bassa probabilità (LP)','Alta probabilità (HP)','Il modello migliore in assoluto'],a:0,w:'È il Type 3: LP. La usa soprattutto come movimento contro trend o nel pomeriggio.'}}
 ]},
 {id:'l23',t:'Doppio purge',p:'pag. 8',st:[
  {s:'Il prezzo prende la liquidità da **entrambi i lati** prima di partire.\n\nPrima esce sopra il CRH e chi ha comprato la rottura resta intrappolato.',d:at(K.dbl,2,{live:true})},
  {s:'Poi scende sotto il CRL, arrivando su un **key level**: ora sono intrappolati anche i venditori.',d:at(K.dbl,3,{live:true})},
  {s:'Infine parte l\'espansione verso il CRH.',d:at(K.dbl,4,{live:true}),m:'Il libro dà solo il disegno. Una cosa si nota: il secondo purge finisce su un key level. Se quello manca, trattalo come un mercato senza direzione.',q:{q:'Cosa ha di particolare il doppio purge?',o:['Prende la liquidità sia sopra sia sotto il range','Non esce mai dal range','Si forma solo di lunedì'],a:0,w:'Doppio purge: un lato e poi l\'altro, prima dell\'espansione.'}}
 ]},
 {id:'l24',t:'Inside bar',p:'pag. 9, 42-44',st:[
  {s:'La candela 1 crea il range. Le candele successive restano **dentro** il suo range: sono le inside bar. Intanto si accumula liquidità in modo molto visibile.',d:at(K.inside,2)},
  {s:'Poi il prezzo esce da un lato: è la falsa rottura sulla liquidità costruita.',d:at(K.inside,3,{live:true})},
  {s:'L\'espansione va verso il lato opposto. Il libro lo considera un modello ad **alta probabilità (HP)**.',d:at(K.inside,5),m:'"Alta probabilità" è un\'affermazione del libro, senza numeri a sostegno. Verifica tu il dato sul tuo strumento.',q:{q:'Perché nell\'inside bar la falsa rottura è considerata forte?',o:['La liquidità è stata costruita bene dentro il range','Le inside bar hanno sempre volumi enormi','Non serve più guardare la direzione'],a:0,w:'Il range stretto concentra gli ordini sui due estremi. Il libro parla di liquidità "ingegnerizzata".'}}
 ]},
 {id:'l25',t:'Continuazione',p:'pag. 10',st:[
  {s:'Qui non c\'è inversione. Ogni candela prende il massimo della precedente, **chiude più in alto** e il ritracciamento resta piccolo. Il massimo appena rotto diventa il riferimento.',d:at(K.cont,3,{live:true})},
  {s:'Il libro indica solo il disegno.',m:'La mia lettura: finché ogni candela chiude oltre il massimo precedente, il flusso continua. Il modello finisce quando una candela non riesce più a chiudere sopra.',q:{q:'Cosa vedi in una Continuation CRT rialzista?',o:['Ogni candela chiude sopra il massimo della precedente','Ogni candela chiude dentro la precedente','Il prezzo prende un minimo e inverte'],a:0,w:'Chiusure sempre più alte: è la continuazione, non un\'inversione.'}}
 ]},
 {id:'l26',t:'Inversione alla terza candela',p:'pag. 32-35',st:[
  {s:'Variante rara. Si forma come la classica, ma è la **candela 3** a manipolare: buca il minimo (o il massimo) della candela 2 e poi corre verso il lato opposto.',d:at(K.third,3,{live:true})},
  {s:'Per il libro è un caso raro, più frequente sui timeframe bassi, dove appare come una figura a tre spinte. Compare con notizie forti, per intrappolare chi entra presto, oppure in condizioni di bassa probabilità.',q:{q:'Hai comprato dopo la candela 2 e la candela 3 scende sotto il suo minimo. Quale modello può essere?',o:['Inversione alla terza candela','Continuazione','CRT a due candele'],a:0,w:'Il purge si sposta sul minimo della candela 2. Per questo lo stop non va messo troppo vicino a quel minimo.'}}
 ]},
 {id:'l27',t:'Quale modello scegliere',p:'pag. 4, 36-38',st:[
  {s:'Attenzione alla numerazione: il libro usa due elenchi diversi.',l:['**Elenco A:** Classic, Two Candle, Multiple Candle, Double Purge, Inside Bar, Continuation.','**Elenco B:** Type 1 Classic, Type 2 aggressiva, Type 3 Multiple (LP), Type 4 Inside Bar (HP), Type 5 terza candela (rara).'],m:'"Inside Bar" è il numero 5 in un elenco e il Type 4 nell\'altro. Nel corso uso i nomi, non i numeri.'},
  {s:'La conclusione del libro è il suo consiglio migliore: **non devi padroneggiare tutto**. Scegli un modello, testalo su storico e poi in tempo reale, e diventa bravo solo su quello.',q:{q:'Qual è il consiglio finale del libro sui modelli?',o:['Sceglierne uno e diventare esperto con i test','Usarli tutti insieme','Evitare il backtest e imparare dal vivo'],a:0,w:'Un solo modello, testato prima su storico e poi in tempo reale.'}}
 ]}
]}
];

COURSE.push(
{id:'m3',t:'Draw on Liquidity',d:'Dove sta andando il prezzo: i quattro metodi.',ls:[
 {id:'l31',t:'Perché il DOL viene prima di tutto',p:'pag. 22, 84, 93',st:[
  {s:'**DOL** vuol dire Draw on Liquidity: il livello che attira il prezzo.\n\nIl libro è netto: è la parte più importante dell\'analisi. Senza DOL stai solo facendo trading sulle figure.'},
  {s:'Una CRT perfetta contro il DOL è una trappola. Il disegno da solo non basta: prima decidi **dove** va il prezzo, poi cerchi **come** salirci sopra.',l:['Metodo 1: massimo e minimo del range di candela','Metodo 2: massimo e minimo del giorno o della settimana precedente','Metodo 3: dinamica di range e livello 50%','Metodo 4: da liquidità interna a esterna e viceversa'],q:{q:'Cosa viene prima, secondo il libro?',o:['Stabilire il DOL','Trovare la figura CRT','Scegliere la dimensione del lotto'],a:0,w:'Prima il DOL. Senza, stai solo cercando disegni sul grafico.'}}
 ]},
 {id:'l32',t:'Metodo 1: range di candela e order flow',p:'pag. 103-109',st:[
  {s:'L\'**order flow** è la direzione prevalente: ribassista se le candele vanno verso i minimi, rialzista se vanno verso i massimi.\n\nNel libro il range ha un DOL di breve termine e uno di lungo termine. Con flusso ribassista il primo è il massimo vicino, il secondo è il minimo lontano.',d:at(K.classic,1,{cap:'Con flusso ribassista: prima il CRH, poi il CRL'})},
  {s:'Con flusso rialzista, order flow, key level e CRT si sommano così:',l:['Il prezzo scende su un key level e prende il minimo.','La CRT si forma proprio sul key level.','Il primo obiettivo è il livello più vicino, il secondo quello successivo.'],m:'Il libro indica "1 DOL" e "2 DOL": due obiettivi in sequenza. È utile per decidere dove prendere il profitto parziale.'},
  {s:'La combinazione da cercare è una sola.',d:[{c:[[52,56,30,34],[34,44,18,38],[38,74,34,70]],zones:[{y1:14,y2:28,a:0,b:2.7,t:'Key level',k:'y'}],lines:[{y:56,a:0,b:2.7,t:'DOL',k:'r'}],cap:'Flusso rialzista + key level + CRT'}],q:{q:'Hai una CRT ribassista bellissima, ma order flow e DOL sono rialzisti. Cosa fai?',o:['Non la opero: è contro il DOL','La opero con lotto doppio','La opero senza stop'],a:0,w:'Il disegno da solo non basta. Se contraddice DOL e flusso, resti fuori.'}}
 ]},
 {id:'l33',t:'Metodo 2: giorno e settimana precedenti',p:'pag. 94-102',st:[
  {s:'Il metodo più semplice: confronta la candela appena chiusa con la precedente. Ci sono sei casi. Vale sul giornaliero e sul settimanale.\n\n**Chiude sopra il massimo precedente:** prezzi più alti, DOL sul massimo della candela appena chiusa.',d:{c:[[30,48,26,44],[44,72,42,70],[70,74,60,72]],lines:[{y:72,a:1,b:2.7,t:'Massimo precedente',k:'r'}],n:3,cap:'Chiusura sopra'}},
  {s:'**Chiude sotto il minimo precedente:** prezzi più bassi, DOL sul minimo.',d:{c:[[70,74,52,56],[56,58,28,30],[30,40,26,28]],lines:[{y:28,a:1,b:2.7,t:'Minimo precedente',k:'r'}],n:3,cap:'Chiusura sotto'}},
  {s:'**Stoppino sopra:** ha superato il massimo ma ha chiuso sotto. Quel massimo è rifiutato: prezzi più bassi, DOL sul minimo precedente.\n\n**Stoppino sotto:** il contrario, prezzi più alti, DOL sul massimo precedente.',d:[{c:[[50,62,42,60],[60,90,50,56],[56,58,30,34]],lines:[{y:62,a:0,b:2.7,t:'Massimo',k:'i'},{y:42,a:0,b:2.7,t:'DOL',k:'r'}],cap:'Stoppino sopra'},{c:[[50,58,38,40],[40,50,10,44],[44,70,42,66]],lines:[{y:38,a:0,b:2.7,t:'Minimo',k:'i'},{y:58,a:0,b:2.7,t:'DOL',k:'r'}],cap:'Stoppino sotto'}]},
  {s:'**Chiude dentro la candela precedente.** Qui conta il contesto:',l:['Mercato rialzista e chiusura dentro: ritracciamento verso il basso, DOL sul minimo precedente.','Mercato ribassista e chiusura dentro: ritracciamento verso l\'alto, DOL sul massimo precedente.','Il libro mostra anche: chiusura dentro più FVG sotto, poi prezzi più alti.'],m:'Sono indizi, non certezze. Una chiusura dentro in trend forte può anche fermarsi su un FVG e ripartire.'},
  {s:'Il libro applica queste regole su EURUSD settimanale, candela per candela. Fallo anche tu sul grafico settimanale di XAUUSD: dieci candele, una previsione alla volta.',q:{q:'La candela giornaliera supera il massimo di ieri ma chiude sotto, con un lungo stoppino. Cosa ti aspetti?',o:['Prezzi più bassi, verso il minimo di ieri','Prezzi più alti, verso un nuovo massimo','Niente: gli stoppini non contano'],a:0,w:'È il caso "stoppino sopra": massimo rifiutato, quindi prezzi più bassi.'}}
 ]},
 {id:'l34',t:'Metodo 3: dinamica di range',p:'pag. 85-88',st:[
  {s:'Individua il range giusto e segna massimo, minimo e 50%.\n\nDentro il range il primo obiettivo è il **50%**. Il secondo è l\'estremo: il massimo o il minimo del range.',d:K.rngB},
  {s:'Con order flow ribassista il prezzo risale a prendere il massimo del range, poi scende. Con order flow rialzista prende il minimo, poi sale.\n\nIl livello preso è il punto in cui cercare la CRT.',q:{q:'Sei in un range con flusso rialzista. Il prezzo ha preso il Range Low. Qual è il primo obiettivo?',o:['Il 50% del range','Il Range Low','Un nuovo minimo'],a:0,w:'Primo DOL: 50%. Secondo DOL: Range High.'}}
 ]},
 {id:'l35',t:'Metodo 4: IRL ed ERL',p:'pag. 89-92',st:[
  {s:'Due tipi di liquidità:',l:['**ERL**, esterna: i massimi e i minimi del range.','**IRL**, interna: FVG, IFVG e order block dentro il range.'],m:'Il prezzo tende ad alternarle: prende una liquidità esterna, torna su una interna, riparte verso la prossima esterna.'},
  {s:'**Premium e discount:** dividi il range al 50%. Sopra è caro (premium), sotto è scontato (discount).\n\nCon flusso rialzista compra in discount. Con flusso ribassista vendi in premium.',d:{c:[[20,24,16,22],[22,64,20,60],[60,86,56,82],[82,84,62,66],[66,68,42,48],[48,56,34,52],[52,88,48,84]],zones:[{y1:50,y2:86,a:0,b:6.7,t:'Premium',k:'r'},{y1:16,y2:50,a:0,b:6.7,t:'Discount',k:'g'}],n:7}},
  {s:'Il libro somma tutto: il prezzo torna su una IRL in discount, si forma una CRT e una **SMT**, l\'obiettivo è la ERL sopra. La SMT la vediamo nel modulo 7.',q:{q:'Quale di questi è una liquidità interna (IRL)?',o:['Un FVG dentro il range','Il massimo del range','Il massimo della settimana scorsa'],a:0,w:'IRL = FVG, IFVG, order block. I massimi e minimi del range sono ERL.'}}
 ]}
]},
{id:'m4',t:'Key level ed entrata',d:'Dove aspettare il prezzo e come entrare.',ls:[
 {id:'l41',t:'I sei key level',p:'pag. 23',st:[
  {s:'Il libro elenca sei key level: **OB, BB, RB, FVG, massimi, minimi**.',l:['**OB:** order block','**BB:** breaker block','**RB:** rejection block','**FVG:** fair value gap','**Massimi** e **minimi** precedenti'],m:'Le righe BB e RB nel PDF sono poco leggibili e il libro non le spiega. Le sigle hanno questo significato nel linguaggio SMC comune.'},
  {s:'Il **fair value gap** è il vuoto tra tre candele: il minimo della terza non arriva al massimo della prima. Il prezzo ci è passato troppo in fretta.',d:at(K.fvg,3,{cap:'Il vuoto tra candela 1 e candela 3'}),q:{q:'Come riconosci un FVG rialzista?',o:['Il minimo della candela 3 resta sopra il massimo della candela 1','Le tre candele sono tutte uguali','La candela 2 è una doji'],a:0,w:'Tra il massimo della 1 e il minimo della 3 resta un vuoto: quello è il FVG.'}}
 ]},
 {id:'l42',t:'Order block e Model #1',p:'pag. 18',st:[
  {s:'La definizione del libro è semplice: la candela che scava sotto un minimo, o sopra un massimo, **quando viene inglobata** diventa un order block.\n\nIn pratica: il prezzo prende un minimo, poi rompe il massimo che lo precede. La zona di partenza è l\'order block.',d:K.ob},
  {s:'Il **Model #1** è l\'ingresso del libro: timeframe M15, si aspetta il ritorno sull\'order block dopo il cambio di direzione.\n\nIn sequenza: purge, rottura del massimo, ritorno sulla zona, ingresso.',m:'Il libro non dice dove mettere lo stop. L\'impostazione logica è oltre l\'estremo del purge, ma ricorda la lezione sulla terza candela: una distanza troppo stretta viene colpita spesso.',q:{q:'Secondo il libro, quando una candela diventa order block?',o:['Quando ha scavato oltre un estremo e viene inglobata','Appena si chiude','Quando è la più grande del giorno'],a:0,w:'Servono due cose: lo scavo oltre l\'estremo e l\'inglobamento.'}}
 ]},
 {id:'l43',t:'Allineare i timeframe',p:'pag. 80-83',st:[
  {s:'L\'esempio del libro è su EURUSD con lo schema 1H, 30M, 5M.\n\n**1H:** si forma il range, con CRH e CRL. Il prezzo scende verso il CRL. Una SSMT dice che quel minimo non è sincronizzato con la coppia correlata.',d:at(K.tf1,7)},
  {s:'**30M:** si vede il key level appena sotto il CRL 1H e il purge lo tocca.\n\n**5M:** si cerca l\'ingresso nel momento del purge. Stop sotto, obiettivo CRH 1H. Nell\'esempio il rapporto è **5R**.',m:'5R vuol dire guadagnare 5 volte il rischio. Un esempio scelto dopo sembra sempre perfetto: non aspettarti 5R ogni volta.',q:{q:'In questo schema, cosa ti dà il grafico a 5 minuti?',o:['Il punto di ingresso','La direzione del giorno','Il DOL settimanale'],a:0,w:'1H = bias, 30M = struttura, 5M = ingresso.'}}
 ]},
 {id:'l44',t:'I compiti del Model #1',p:'pag. 62-72',st:[
  {s:'Il libro dedica dieci pagine a cinque esempi reali, su EURUSD e GBPUSD: ogni CRT **giornaliera** è affiancata al grafico **H1**, dove è segnato il Model #1.\n\nDal giorno vedi la CRT. Dall\'ora vedi dove sarebbe stato l\'ingresso.'},
  {s:'Il compito per te:',l:['Apri il PDF alle pagine 63-72.','Su ogni esempio copri la parte destra del grafico.','Segna CRH, CRL e il tuo ingresso.','Scopri il grafico e confronta.','Ripeti lo stesso esercizio su 20 giorni di XAUUSD.'],m:'Gli esempi del libro sono tutti vincenti: sono stati scelti. Nei tuoi 20 giorni segna anche quelli andati male, altrimenti il test non vale.',q:{q:'Perché devi annotare anche le CRT andate male?',o:['Per misurare quanto funziona davvero il modello','Per complicare il lavoro','Perché il libro lo vieta'],a:0,w:'Se guardi solo i casi vincenti, ti sembrerà che il modello non sbagli mai.'}}
 ]}
]},
{id:'m5',t:'Il profilo a 7 ore',d:'Come Asia e Londra preparano New York.',ls:[
 {id:'l51',t:'Il giorno diviso in tre',p:'pag. 53-55, 58',st:[
  {s:'Il **7H Profiling** divide la giornata in tre blocchi da 7 ore. Ogni blocco dà contesto a quello dopo. Sta tra bias e ingresso: è la **conferma**.',d:K.sess},
  {s:'Gli orari (New York) sono diversi per strumento:',l:['**Indici e metalli:** 18:00 Asia, 01:00 Londra, 08:00 New York','**Forex:** 17:00 Asia, 00:00 Londra, 07:00 New York'],m:'Sul libro il forex è scritto con "12:00", ma per avere blocchi da 7 ore deve essere mezzanotte (12:00 am). Il tuo XAUUSD usa 18, 01, 08. Nella scheda Strumenti trovi gli orari già convertiti per l\'Italia.',q:{q:'Su XAUUSD, a che ora di New York inizia il blocco di Londra?',o:['01:00','08:00','12:00'],a:0,w:'Metalli e indici: 18:00, 01:00, 08:00.'}}
 ]},
 {id:'l52',t:'I tre profili',p:'pag. 56-57, 60-61',st:[
  {s:'**Inversione alle 18:00 (Asia).** È Asia a fare l\'estremo del giorno. Londra si allontana e conferma, New York continua. È lì la migliore occasione.',d:{c:[[30,48,16,44],[44,60,38,56],[56,90,50,84]],n:3,cap:'18 - 01 - 08: tre candele nella stessa direzione'}},
  {s:'**Inversione alle 01:00 (Londra).** Asia è solo un range. Londra manipola il range e fa partire la direzione, New York continua.',d:{c:[[46,56,38,40],[40,62,18,56],[56,90,48,84]],n:3,cap:'Asia laterale, Londra inverte'}},
  {s:'**Inversione alle 08:00 (New York).** Il libro mostra solo il disegno: Asia e Londra spingono o restano ferme, è New York a prendere il minimo e invertire con la candela più grande.',d:{c:[[60,64,44,48],[48,56,42,52],[52,90,14,84]],n:3,cap:'Il lavoro lo fa tutto New York'},q:{q:'Asia resta laterale, Londra prende il minimo di Asia e sale. Che profilo è?',o:['Inversione alle 01:00 (Londra)','Inversione alle 18:00 (Asia)','Inversione alle 08:00 (New York)'],a:0,w:'Asia è il range, Londra manipola e dà la direzione, New York continua.'}}
 ]},
 {id:'l53',t:'Perché New York',p:'pag. 59',st:[
  {s:'Il libro si concentra su New York per quattro motivi:',l:['Spesso c\'è l\'espansione principale del giorno.','Partecipazione e liquidità sono più alte.','Asia e Londra hanno già dato il contesto.','Ci sono più occasioni di movimento e continuazione.']},
  {s:'La catena completa è: **bias HTF, profilo 7H, contesto di New York, conferma delle 8:00, ingresso.**\n\nA ogni anello puoi fermarti e non operare.',q:{q:'Quale ordine è quello giusto?',o:['Bias HTF, profilo 7H, contesto NY, conferma, ingresso','Ingresso, conferma, bias HTF, profilo 7H','Profilo 7H, ingresso, bias HTF, conferma'],a:0,w:'Si parte dal timeframe alto e si scende verso l\'ingresso, mai il contrario.'}}
 ]}
]},
{id:'m6',t:'La CRT delle 9:00',d:'Il capitolo più importante: il protocollo in 8 passi.',ls:[
 {id:'l61',t:'I primi due passi: DOL e narrativa',p:'pag. 21-23',st:[
  {s:'Il libro definisce questo capitolo il più importante. Parliamo della candela **H4 delle 9:00 di New York**, che in Italia di solito sono le **15:00**.\n\nÈ un protocollo in 8 passi. Primo passo: **determina il DOL**.',m:'Sul tuo MT5 controlla l\'ora del server. Con tanti broker è New York +7: lì la candela è quella delle 16:00. La scheda Strumenti ti dà l\'ora italiana esatta anche nelle settimane di cambio dell\'ora.'},
  {s:'Secondo passo: **costruisci la narrativa**, cioè la storia che il mercato sta raccontando. Il libro ne indica due tipi:',l:['**Basata sul prezzo:** modelli market maker, power of three, dealing range, OHLC, range di candela.','**Basata sul tempo:** comportamento delle sessioni, profili intraday e settimanali.'],q:{q:'Il comportamento delle sessioni fa parte di quale narrativa?',o:['Basata sul tempo','Basata sul prezzo','Nessuna delle due'],a:0,w:'Sessioni e profili sono narrativa temporale. OHLC e range sono narrativa di prezzo.'}}
 ]},
 {id:'l62',t:'Passo 3: trovare la CRT',p:'pag. 24',st:[
  {s:'Per la candela delle 9:00 ci sono tre candele H4 di riferimento:',l:['**21:00**: range di Asia','**01:00**: sessione di Londra','**05:00**: pausa di Londra e apertura di New York'],m:'Il libro dice che il modello delle 9:00 è "facile e molto probabile". Non porta statistiche. Trattalo come un\'ipotesi da verificare.'},
  {s:'Quindi guardi quale di queste candele ha fatto range e quale ha preso liquidità. La candela delle 9:00 è quella che deve distribuire verso il DOL.',q:{q:'Quale candela H4 rappresenta il range di Asia?',o:['Quella delle 21:00','Quella delle 01:00','Quella delle 05:00'],a:0,w:'21:00 Asia, 01:00 Londra, 05:00 pausa di Londra e apertura NY.'}}
 ]},
 {id:'l63',t:'Passo 4: continuazione di New York',p:'pag. 25-28',st:[
  {s:'Ci sono due profili possibili per le 9:00. Il primo è la **continuazione**: Londra ha già scelto la direzione e New York la prosegue.\n\nNell\'esempio ribassista il prezzo risale sul CRH 1H, prende quella liquidità e poi cade.',d:K.ny1},
  {s:'Sul grafico H4 di solito vedi: la candela delle 05:00 con uno stoppino sopra, poi la candela delle 09:00 grande e rossa. La zona buona è tra le 9:00 e le 11:00.',d:{c:[[34,70,26,66],[66,92,62,64],[64,68,14,20]],lines:[{y:70,a:0,b:2.7,t:'Massimo 01:00',k:'i'}],n:3,cap:'Candele H4 delle 01:00, 05:00, 09:00'},q:{q:'Nella continuazione di New York, cosa fa il prezzo prima di ripartire?',o:['Ritraccia e prende una liquidità vicina, come il CRH 1H','Inverte la direzione di Londra','Resta fermo fino alle 11:00'],a:0,w:'Pullback, purge del CRH 1H e ripartenza nella direzione di Londra.'}}
 ]},
 {id:'l64',t:'Passo 4: inversione di New York',p:'pag. 11-12, 19, 29-30',st:[
  {s:'Il secondo profilo è l\'**inversione**: New York prende l\'estremo della sessione e cambia direzione.',d:K.ny2},
  {s:'Il libro la permette solo a queste condizioni:',l:['Il **DOL giornaliero è già stato raggiunto** e lì si sta formando l\'inversione.','Massimi e minimi di Asia e Londra sono **protetti**.','Asia e Londra **non si sono espanse**.','Sei su un **key level HTF**.','Sei nell\'orario chiave: ora del giorno e giorno della settimana.']},
  {s:'Se il bias è molto chiaro puoi usare anche la **CRT H1 delle 9:00**:',l:['Bias e DOL devono essere molto chiari.','Trova il key level: OB, FVG, massimi, minimi.','Asia e Londra devono essere protette.','Segna CRH e CRL della candela H1 delle 8:00.','Aspetta la conferma.','Conferma: purge del CRH o CRL, tocco del key level, order block su M5.'],q:{q:'Quando il libro permette l\'inversione delle 9:00?',o:['Solo se il DOL giornaliero è stato raggiunto','Tutti i giorni alle 9:00','Quando Asia e Londra si sono espanse molto'],a:0,w:'Prima il DOL giornaliero raggiunto. Inoltre Asia e Londra protette e non espanse.'}}
 ]},
 {id:'l65',t:'Passo 5: OHLC e OLHC',p:'pag. 13-14',st:[
  {s:'Una candela ribassista di solito fa **OHLC**: apre, sale al massimo, scende al minimo, chiude. Una rialzista fa **OLHC**: apre, scende al minimo, sale al massimo, chiude.\n\nDa qui una regola: **compra sotto l\'apertura, vendi sopra l\'apertura**.',d:[{c:[[52,90,12,20]],n:1,live:true,lines:[{y:52,a:0,b:.8,t:'Apertura',k:'r'}],cap:'OHLC: vendi sopra'},{c:[[48,88,10,80]],n:1,live:true,lines:[{y:48,a:0,b:.8,t:'Apertura',k:'r'}],cap:'OLHC: compra sotto'}]},
  {s:'Secondo il libro devi operare quando il mercato forma il massimo o il minimo della candela delle 9:00 **nell\'orario chiave**. Una SMT in quel punto è la conferma.',q:{q:'Bias ribassista. Il prezzo è sotto l\'apertura della candela H4 delle 9:00. Cosa fai?',o:['Non vendo qui: aspetto che salga sopra l\'apertura','Vendo subito','Compro'],a:0,w:'Con bias ribassista si vende sopra l\'apertura. Sotto, il prezzo è già "scontato".'}}
 ]},
 {id:'l66',t:'Passi 6, 7 e 8: SMT, orario, ingresso',p:'pag. 15-18',st:[
  {s:'**Passo 6, SMT.** Confronta due coppie correlate, nel libro EURUSD e GBPUSD (su oro puoi usare XAGUSD).\n\nPausa di Londra contro New York: una fa un nuovo minimo, l\'altra no, poi si sale. Oppure New York contro Londra: una fa un nuovo massimo, l\'altra no, poi si scende.'},
  {s:'**Passo 7, orario chiave.** Le finestre per la CRT delle 9:00 sono due:',l:['Dalle 9:00 alle 10:00','Dalle 9:30 alle 10:30'],m:'In Italia di solito sono 15:00-16:00 e 15:30-16:30. Fuori da queste finestre il setup per il libro non è valido.'},
  {s:'**Passo 8, ingresso.** Timeframe M15, modello Model #1 oppure order block: come nel modulo 4.',q:{q:'Sono le 11:30 a New York e vedi una CRT perfetta sulle 9:00. È valida per il protocollo?',o:['No, è fuori dall\'orario chiave','Sì, l\'orario non conta','Sì, ma solo con lotto doppio'],a:0,w:'L\'orario è una delle condizioni di validità: 9:00-10:00 o 9:30-10:30.'}}
 ]},
 {id:'l67',t:'La lista di controllo',p:'pag. 20',st:[
  {s:'Il libro chiude con cinque punti da verificare:',l:['**DOL:** order flow giornaliero e DOL sono d\'accordo con il tuo bias.','**Struttura:** è chiara e la CRT si forma su un key level.','**Tempo:** il setup si forma nell\'orario previsto.','**Confluenze:** purge, tocco del key level e CISD sui timeframe bassi.','**Bias:** è pulito e sostenuto dal timeframe alto.'],m:'CISD è il cambio di direzione del prezzo sul timeframe basso. Nella scheda Strumenti trovi questa lista in forma interattiva.'},
  {s:'Basta che ne manchi uno e la risposta è semplice: **niente trade**.',q:{q:'Hai 4 punti su 5, manca il key level. Cosa fai?',o:['Resto fuori','Entro con metà lotto','Entro lo stesso: quattro bastano'],a:0,w:'Il protocollo chiede tutte le conferme. Il trade migliore, a volte, è quello che non fai.'}}
 ]}
]},
{id:'m7',t:'SMT Divergence',d:'Due mercati correlati che non sono d\'accordo.',ls:[
 {id:'l71',t:'La correlazione',p:'pag. 112-114, 142-144',st:[
  {s:'**SMT** significa confrontare due strumenti che di solito si muovono insieme. Il libro elenca queste coppie:',l:['EURUSD con GBPUSD','AUDUSD con NZDUSD','USDCAD con USDCHF','EURCAD con GBPCAD, AUDCAD con NZDCAD','EURAUD con GBPAUD, EURNZD con GBPNZD','EURCHF con GBPCHF, AUDCHF con NZDCHF','AUDJPY con NZDJPY','EURJPY con GBPJPY e CHFJPY','**XAUUSD con XAUGBP, XAUEUR e XAGUSD**']},
  {s:'Se due coppie correlate fanno un nuovo massimo insieme, tutto regolare. Se **una lo fa e l\'altra no**, c\'è una divergenza.\n\nDivergenza sui massimi: ribassista. Divergenza sui minimi: rialzista.',d:[K.smtA,K.smtB],q:{q:'XAUUSD fa un minimo più basso, XAGUSD fa un minimo più alto. Che segnale è?',o:['SMT rialzista','SMT ribassista','Nessun segnale'],a:0,w:'Divergenza sui minimi: uno non conferma la discesa. SMT rialzista.'}}
 ]},
 {id:'l72',t:'A cosa serve davvero',p:'pag. 115-116',st:[
  {s:'Il libro lo dice bene: la SMT ti indica che una rottura di struttura (BOS o MSS) **non è valida**, ma è un semplice sweep di liquidità.\n\nSu una coppia sembra una rottura vera, sull\'altra non c\'è stata rottura. Quindi non è un cambio di direzione, ma una trappola.',d:[{p:[[0,90],[14,70],[30,86],[44,40],[56,62],[70,30],[100,84]],lines:[{y:40,a:30,b:100,t:'Rotto',k:'r'}],zones:[{x1:30,x2:100,y1:20,y2:38,t:'Zona',k:'y'}],cap:'Coppia 1: BOS'},{p:[[0,90],[14,70],[30,86],[44,40],[56,62],[70,46],[100,90]],lines:[{y:40,a:30,b:100,t:'Non rotto',k:'r'}],zones:[{x1:30,x2:100,y1:20,y2:38,t:'Zona',k:'y'}],cap:'Coppia 2: nessun BOS'}]},
  {s:'La SMT va cercata in un punto preciso: su un key level (FVG, OB) o su un obiettivo.',m:'Una SMT in mezzo al nulla non vale niente. Le divergenze sono continue: conta il dove.',q:{q:'Cosa ti dice una SMT su un minimo rotto?',o:['La rottura è probabilmente uno sweep','La rottura è vera e il prezzo continuerà','Devi chiudere la piattaforma'],a:0,w:'L\'altra coppia non conferma. Per il libro quella è una presa di liquidità, non un cambio vero.'}}
 ]},
 {id:'l73',t:'SSMT e QSMT',p:'pag. 117, 147',st:[
  {s:'Il libro mostra un disegno: due grafici con la divergenza che attraversa i quarti **Q2 e Q3**.',m:'Il libro non aggiunge spiegazioni, quindi questa è una mia lettura. QSMT significa che i due estremi da confrontare stanno in quarti consecutivi. Il riferimento temporale è la Quarterly Theory del modulo 8.'},
  {s:'In pratica: il minimo di Q2 e quello di Q3 vengono confrontati su due coppie. Una fa un minimo più basso, l\'altra uno più alto.',q:{q:'In che cosa la QSMT si differenzia dalla SMT base?',o:['Confronta estremi in quarti di tempo vicini','Usa una sola coppia','Vale solo sul settimanale'],a:0,w:'Il confronto si fa tra quarti consecutivi, come Q2 e Q3.'}}
 ]},
 {id:'l74',t:'Hint SMT',p:'pag. 118, 148',st:[
  {s:'Il libro mette a confronto candele e **grafico a linea**. Gli stoppini possono prendere il minimo su entrambe le coppie, mentre le **chiusure** divergono.',d:[{p:[[0,80],[22,30],[48,70],[76,36],[100,90]],lines:[{y:30,a:15,t:'Chiusure in salita',k:'r'}],cap:'Coppia 1 (linea)'},{p:[[0,80],[22,36],[48,70],[76,24],[100,90]],lines:[{y:36,a:15,t:'Chiusure in discesa',k:'r'}],cap:'Coppia 2 (linea)'}],m:'Anche qui il libro mostra solo il disegno. La mia lettura: passa al grafico a linea per vedere la divergenza sulle chiusure.',q:{q:'Dove si vede meglio una hint SMT?',o:['Sul grafico a linea, che mostra le chiusure','Solo sugli stoppini','Sugli indicatori di volume'],a:0,w:'Il grafico a linea collega le chiusure e toglie il rumore degli stoppini.'}}
 ]},

function el(n,a,p){const e=document.createElementNS(SVG,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function txt(p,x,y,t,o){const e=el('text',Object.assign({x,y,'font-family':'Hand','font-size':15,fill:'#1c2840'},o||{}),p);e.textContent=t;return e}
function chart(sp){
 const W=340,H=sp.h||230,wrap=document.createElement('div');wrap.className='chart';
 const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,role:'img'},wrap);
 const ys=[];(sp.c||[]).forEach(c=>ys.push(c[1],c[2]));(sp.p||[]).forEach(p=>ys.push(p[1]));(sp.lines||[]).forEach(l=>ys.push(l.y));(sp.zones||[]).forEach(z=>ys.push(z.y1,z.y2));
 const lo=Math.min(...ys)-4,hi=Math.max(...ys)+4,Y=v=>10+(H-20)*(1-(v-lo)/(hi-lo));
 const n=sp.n==null?(sp.c?sp.c.length:0):sp.n;
 const longest=Math.max(0,...(sp.lines||[]).map(l=>(l.t||'').length));
 const strip=sp.c?Math.min(120,longest*6.4+8):0,plotW=W-strip-4;
 const X=sp.c?(i=>4+plotW/sp.c.length*(i+.5)):(v=>4+(W-8)*v/100);
 const xa=(l,d)=>sp.c?X(l.a==null?0:l.a):X(l.a==null?0:l.a);
 const xb=l=>sp.c?(l.b>=sp.c.length-1.5?W-2:X(l.b)):(l.b==null?W-2:X(l.b));
 (sp.zones||[]).forEach(z=>{if(z.at&&z.at>n)return;
  const x1=sp.c?X(z.a||0)-10:X(z.x1),x2=sp.c?W-2:X(z.x2);
  el('rect',{x:x1,y:Y(z.y2),width:x2-x1,height:Y(z.y1)-Y(z.y2),fill:COL[z.k]||COL.y,opacity:z.k==='y'?.55:.13},svg);
  if(z.t)txt(svg,x1+5,Y(z.y2)+15,z.t,{'font-size':14,'font-weight':700,fill:z.k==='y'?'#1c2840':COL[z.k]});
 });
 (sp.lines||[]).forEach(l=>{if(l.at&&l.at>n)return;
  const x1=xa(l),x2=xb(l),c=COL[l.k]||COL.i;
  el('line',{x1,x2,y1:Y(l.y),y2:Y(l.y),stroke:c,'stroke-width':1.6},svg);
  if(l.t)txt(svg,x2-1,Y(l.y)-4,l.t,{'text-anchor':'end',fill:c,'font-weight':700,'font-size':14});
 });
 if(sp.p){el('polyline',{points:sp.p.map(p=>X(p[0])+','+Y(p[1])).join(' '),fill:'none',stroke:'#1c2840','stroke-width':2,'stroke-linejoin':'round'},svg)}
 const live=[];
 if(sp.c){const cw=Math.min(34,plotW/sp.c.length*.62);
  sp.c.slice(0,n).forEach((c,i)=>{const g=el('g',{},svg),x=X(i);
   const w=el('line',{x1:x,x2:x,stroke:'#1c2840','stroke-width':2},g),b=el('rect',{x:x-cw/2,width:cw,'stroke-width':2},g);
   const set=(o,h,l,p)=>{const up=p>=o;w.setAttribute('y1',Y(h));w.setAttribute('y2',Y(l));
    b.setAttribute('y',Y(Math.max(o,p)));b.setAttribute('height',Math.max(2,Math.abs(Y(o)-Y(p))));
    b.setAttribute('fill',up?'#fff':'#1c2840');b.setAttribute('stroke',up?COL.g:'#1c2840');w.setAttribute('stroke',up?COL.g:'#1c2840')};
   set(c[0],c[1],c[2],c[3]);if(i===n-1&&sp.live)live.push({c,set});
  })}
 if(sp.cap){const p=document.createElement('p');p.className='cap';p.textContent=sp.cap;wrap.appendChild(p)}
 if(live.length){const go=()=>playCandle(live[0]);
  const b=document.createElement('button');b.className='replay';b.textContent='Rivedi la candela';b.onclick=go;wrap.appendChild(b);setTimeout(go,260)}
 return wrap}
function playCandle(L){const [o,h,l,c]=L.c;const way=c>=o?[o,l,h,c]:[o,h,l,c];
 if(reduce){L.set(o,h,l,c);return}
 const T=2200,t0=performance.now();let hi=o,lo=o;
 const f=t=>{const u=Math.max(0,Math.min(1,(t-t0)/T)),s=u*3,k=Math.min(2,Math.floor(s)),r=s-k,p=way[k]+(way[k+1]-way[k])*r;
  hi=Math.max(hi,p);lo=Math.min(lo,p);L.set(o,hi,lo,p);if(u<1)requestAnimationFrame(f)};
 L.tok=(L.tok||0)+1;requestAnimationFrame(f)}

function home(){const n=LS.filter(l=>S.done[l.id]).length,next=LS.find(l=>!S.done[l.id]);
 const b=div(`<div class="hero"><h1>Maestro CRT</h1><p class="sum muted">${n===0?'Candle Range Theory spiegata passo dopo passo.':`Hai completato ${n} lezioni su ${LS.length}.`}</p></div>`);
 if(next){const c=$(`<button class="btn">${n?'Continua':'Inizia'}: ${next.t}</button>`);c.onclick=()=>go('#/l/'+next.id+'/'+(S.pos[next.id]||0));b.querySelector('.hero').appendChild(c)}
 COURSE.forEach((m,i)=>{const dn=m.ls.filter(l=>S.done[l.id]).length,open=S.open===m.id;
  const w=$(`<section class="mod"><button aria-expanded="${open}"><span class="n">${i}</span><span><strong>${m.t}</strong><span class="d">${m.d}</span></span><span class="c">${dn}/${m.ls.length}</span></button></section>`);
  w.firstChild.onclick=()=>{S.open=open?'':m.id;save();home()};
  if(open)m.ls.forEach(l=>{const r=$(`<button class="ls"><span class="box ${S.done[l.id]?'ok':''}"></span><span>${l.t}<span class="d muted small" style="display:block">${l.p}</span></span></button>`);r.onclick=()=>go('#/l/'+l.id+'/0');w.appendChild(r)});
  b.appendChild(w)});
 shell('#/',b)}

function lesson(id,i){const l=byId(id);if(!l)return go('#/');i=Math.max(0,Math.min(i,l.st.length-1));S.pos[id]=i;save();
 const st=l.st[i];app.innerHTML='';
 const top=$(`<div class="top"><button class="x" aria-label="Chiudi la lezione">×</button><div class="bar"><i style="width:${(i+1)/l.st.length*100}%"></i></div><span class="pg">${l.p}</span></div>`);
 top.querySelector('.x').onclick=()=>{S.open=l.m.id;save();go('#/')};app.appendChild(top);
 const pg=document.createElement('div');pg.className='page';const s=div('');s.className='step';
 if(i===0)s.appendChild($(`<h2>${l.t}</h2>`));
 s.appendChild(div(md(st.s)));
 if(st.d)charts(st.d,s);
 if(st.l)s.appendChild($(`<ul>${st.l.map(x=>`<li>${inl(x)}</li>`).join('')}</ul>`));
 if(st.m)s.appendChild($(`<div class="note">${inl(st.m)}</div>`));
 const foot=$(`<div class="foot"></div>`),last=i===l.st.length-1;
 if(i>0){const b=$(`<button class="btn alt">Indietro</button>`);b.onclick=()=>go('#/l/'+id+'/'+(i-1));foot.appendChild(b)}
 const nx=$(`<button class="btn">${last?'Finisci la lezione':'Avanti'}</button>`);foot.appendChild(nx);
 nx.onclick=()=>{if(last){S.done[id]=true;delete S.pos[id];save();go('#/fine/'+id)}else go('#/l/'+id+'/'+(i+1))};
 if(st.q){nx.disabled=true;s.appendChild(quiz(st.q,id+':'+i,ok=>{if(ok)nx.disabled=false}))}
 pg.appendChild(s);app.appendChild(pg);app.appendChild(foot);pg.scrollTop=0}

function quiz(q,key,cb){const w=$(`<div class="q"><h3>${q.q}</h3></div>`);let won=false;
 const why=$(`<div class="why"></div>`);
 shuffle(q.o.map((t,i)=>({t,i}))).forEach(o=>{const b=$(`<button class="opt">${o.t}</button>`);
  b.onclick=()=>{if(won)return;const ok=o.i===q.a;
   if(ok){won=true;b.classList.add('ok');why.className='why ok';why.textContent='Giusto. '+q.w;if(key)delete S.wrong[key]}
   else{b.classList.add('no');b.disabled=true;why.className='why no';why.textContent='Non proprio. Rileggi e riprova.';if(key)S.wrong[key]=1}
   save();cb&&cb(ok)};w.appendChild(b)});
 w.appendChild(why);return w}

function fine(id){const l=byId(id),ix=LS.indexOf(l),nx=LS[ix+1];
 const b=div(`<div class="done"><div class="stamp">Bravo!</div><h2>${l.t}</h2><p class="muted">Lezione completata.</p></div>`);
 const d=b.firstChild;
 if(nx){const c=$(`<button class="btn">Prossima: ${nx.t}</button>`);c.onclick=()=>go('#/l/'+nx.id+'/0');d.appendChild(c)}
 else{const c=$(`<button class="btn">Vai al simulatore</button>`);c.onclick=()=>go('#/sim');d.appendChild(c)}
 const h=$(`<button class="btn alt" style="margin-top:10px">Torna al corso</button>`);h.onclick=()=>{S.open=(nx||l).m.id;save();go('#/')};d.appendChild(h);
 shell('#/',b)}

/* ---- allenamento ---- */
function allQ(){const r=[];LS.forEach(l=>l.st.forEach((s,i)=>{if(s.q)r.push({q:s.q,key:l.id+':'+i,l})}));return r}
function train(){const wr=Object.keys(S.wrong).length;
 const b=div(`<h2>Allenati</h2><div class="sp"></div>`);
 [['#/sim','Simulatore di decisioni',`Casi sempre nuovi: compra, vendi o resta fuori.${S.sim.n?` Decisioni giuste: ${S.sim.ok} su ${S.sim.n}.`:''}`],
  ['#/exam','Esame generale','15 domande a caso da tutto il corso.'],
  ['#/review','Ripasso errori',wr?`${wr} domande da rifare.`:'Le domande sbagliate finiscono qui.'],
  ['#/flash','Schede del glossario','Una sigla, la giri, controlli se la sapevi.']].forEach(([h,t,d])=>{const c=$(`<button class="card"><b>${t}</b><span class="muted small">${d}</span></button>`);c.onclick=()=>go(h);b.appendChild(c)});
 shell('#/train',b)}

function runQ(list,title,back){let i=0,ok=0,miss=false;
 const draw=()=>{const it=list[i],b=div(`<h2>${title}</h2><p class="muted small">Domanda ${i+1} di ${list.length}. Lezione: ${it.l.t}</p>`);
  const nx=$(`<button class="btn" disabled style="margin-top:12px">${i===list.length-1?'Vedi il risultato':'Avanti'}</button>`);
  miss=false;
  b.appendChild(quiz(it.q,it.key,g=>{if(g){if(!miss)ok++;nx.disabled=false}else miss=true}));
  nx.onclick=()=>{i++;i<list.length?draw():end()};b.appendChild(nx);shell(back,b)};
 const end=()=>{const b=div(`<div class="done"><div class="stamp">${ok}/${list.length}</div><p class="muted">Conta chi ha risposto bene al primo tentativo.</p></div>`);
  const c=$(`<button class="btn">Torna ad Allenati</button>`);c.onclick=()=>go('#/train');b.firstChild.appendChild(c);shell(back,b)};
 draw()}

function review(){const a=allQ().filter(x=>S.wrong[x.key]);
 if(!a.length){const b=div(`<h2>Ripasso errori</h2><p class="muted" style="margin-top:10px">Non hai errori da rifare. Fai qualche lezione o l'esame generale.</p>`);shell('#/train',b);return}
 runQ(a,'Ripasso errori','#/train')}

const rnd=(a,b)=>a+Math.random()*(b-a);const pick=a=>a[Math.floor(Math.random()*a.length)];
function genCase(){const kind=pick(['ok','ok','ok','out','nosweep','bias','nokey','late']);const bull=Math.random()<.5;
 const l=rnd(30,40),h=rnd(68,80),o=rnd(h-6,h-1),c=rnd(l+1,l+6);let c1=[o,h,l,c];
 let o2=c,c2;
 if(kind==='out')c2=[o2,o2+rnd(2,6),l-rnd(10,16),l-rnd(3,8)];
 else if(kind==='nosweep')c2=[o2,o2+rnd(14,24),l+rnd(2,6),o2+rnd(10,16)];
 else{const low=l-rnd(6,12);c2=[o2,o2+rnd(10,16),low,o2+rnd(5,12)]}
 const win=Math.random()<.55,c3s=c2[3];
 const c3=win?[c3s,h+rnd(4,10),c3s-rnd(1,4),h+rnd(1,4)]:[c3s,c3s+rnd(2,8),c2[2]-rnd(4,10),c2[2]-rnd(1,4)];
 let ch={c:[c1,c2,c3],lines:[{y:h,a:0,b:9,t:'CRH',k:'i'},{y:l,a:0,b:9,t:'CRL',k:'i'}]};
 if(!bull)ch=flip(ch);
 const dirOk=bull?'buy':'sell',dirTxt=bull?'rialzista':'ribassista',opp=bull?'ribassista':'rialzista';
 const ctx={of:kind==='bias'?opp:dirTxt,key:kind==='nokey'?'Nessuno vicino':'Sì, sotto il purge'.replace('sotto',bull?'sotto':'sopra'),t:kind==='late'?'13:30':pick(['9:15','9:40','10:05'])};
 const ans=kind==='ok'?dirOk:'none';
 const why={ok:`Tutto a posto: purge, chiusura dentro, order flow ${dirTxt}, key level e orario giusti. Obiettivo: ${bull?'CRH':'CRL'}.`,
  out:'La candela ha chiuso fuori dal range: è una rottura, non un purge. Si resta fuori.',
  nosweep:'Nessun purge: il prezzo non ha preso la liquidità. Senza purge non c\'è setup.',
  bias:`Il purge c'è, ma va contro l'order flow ${opp}. Si resta fuori.`,
  nokey:'Manca il key level. Il disegno da solo non basta.',late:'Il disegno è buono, ma alle 13:30 sei fuori dall\'orario chiave.'}[kind];
 return {ch,ctx,ans,why,win,bull}}
function sim(){const k=genCase();const b=div(`<h2>Simulatore</h2><p class="muted small">Candele H4 di fantasia. Decisioni giuste: ${S.sim.ok} su ${S.sim.n}.</p>`);
 charts(Object.assign({},k.ch,{n:2,live:true}),b);
 b.appendChild(div(`<div class="rows"><div><span>Order flow</span><b>${k.ctx.of}</b></div><div><span>Key level</span><b>${k.ctx.key}</b></div><div><span>Ora di New York</span><b>${k.ctx.t}</b></div></div>`));
 const res=div('');const opts=div('');
 [['buy','Compro'],['sell','Vendo'],['none','Non opero']].forEach(([v,t])=>{const o=$(`<button class="opt">${t}</button>`);
  o.onclick=()=>{const ok=v===k.ans;S.sim.n++;if(ok)S.sim.ok++;save();
   opts.innerHTML='';res.innerHTML='';
   res.appendChild($(`<div class="why ${ok?'ok':'no'}">${ok?'Decisione giusta.':'Decisione sbagliata.'} ${k.why}</div>`));
   const tail=div(`<p class="small muted" style="margin-top:12px">Ecco la candela successiva:</p>`);res.appendChild(tail);
   tail.appendChild(chart(Object.assign({},k.ch,{n:3,live:true})));
   if(k.ans!=='none')tail.appendChild($(`<p class="small muted">${k.win?'Stavolta l\'obiettivo è stato raggiunto.':'Stavolta il trade sarebbe finito in stop.'} L'esito è casuale: qui conta la decisione, non il risultato.</p>`));
   else tail.appendChild($(`<p class="small muted">L'esito è casuale: qui conta la decisione, non il risultato.</p>`));
   const nx=$(`<button class="btn" style="margin-top:12px">Nuovo caso</button>`);nx.onclick=sim;res.appendChild(nx)};opts.appendChild(o)});
 b.appendChild(opts);b.appendChild(res);shell('#/train',b)}
function flash(){let a=shuffle(GLOSS),i=0,sh=false;
 const draw=()=>{const b=div(`<h2>Schede</h2><p class="muted small">Scheda ${i+1} di ${a.length}. Tocca per girarla.</p>`);
  const c=$(`<button class="flash">${sh?`<span class="a">${a[i][1]}</span>`:`<span class="w">${a[i][0]}</span>`}</button>`);c.onclick=()=>{sh=!sh;draw()};b.appendChild(c);
  const nx=$(`<button class="btn">Prossima scheda</button>`);nx.onclick=()=>{i=(i+1)%a.length;sh=false;draw()};b.appendChild(nx);shell('#/train',b)};draw()}

/* ---- orari ---- */
function off(tz,d){const p=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}).formatToParts(d),g={};p.forEach(x=>g[x.type]=+x.value);return (Date.UTC(g.year,g.month-1,g.day,g.hour,g.minute,g.second)-d.getTime())/6e4}
function nyDate(d){const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',hourCycle:'h23'}).formatToParts(d),g={};p.forEach(x=>g[x.type]=+x.value);return g}
function nyToUTC(g,h,m,dd){let t=Date.UTC(g.year,g.month-1,g.day+(dd||0),h,m);t-=off('America/New_York',new Date(t))*6e4;return new Date(t)}
const fmt=(d,tz)=>new Intl.DateTimeFormat('it-IT',{timeZone:tz,hour:'2-digit',minute:'2-digit'}).format(d);
const it=(g,h,m,dd)=>fmt(nyToUTC(g,h,m,dd),'Europe/Rome');
function sessionNow(g){const h=g.hour+g.minute/60;
 if(h>=18||h<1)return 'Asia';if(h<8)return 'Londra';if(h<17)return 'New York';return 'Mercato in chiusura'}
function tools(){const now=new Date(),g=nyDate(now),gap=(off('Europe/Rome',now)-off('America/New_York',now))/60;
 const rows=a=>`<div class="rows">${a.map(([x,y])=>`<div><span>${x}</span><b>${y}</b></div>`).join('')}</div>`;
 const b=div(`<h2>Orari per l'Italia</h2>
 <div class="clock"><div><span class="muted small">Italia</span><b>${fmt(now,'Europe/Rome')}</b></div><div><span class="muted small">New York</span><b>${fmt(now,'America/New_York')}</b></div></div>
 <p class="note">Differenza di oggi: ${gap} ore. Blocco metalli in corso: ${sessionNow(g)}.</p>
 <h3>Candele H4</h3>${rows([['21:00 NY, range di Asia',it(g,21,0,-1)],['01:00 NY, Londra',it(g,1,0)],['05:00 NY, pausa di Londra',it(g,5,0)],['09:00 NY, candela chiave',it(g,9,0)]])}
 <h3>Orario chiave</h3>${rows([['Dalle 9:00 alle 10:00 NY',it(g,9,0)+'-'+it(g,10,0)],['Dalle 9:30 alle 10:30 NY',it(g,9,30)+'-'+it(g,10,30)]])}
 <h3>Profilo 7H, oro e indici</h3>${rows([['Asia',it(g,18,0,-1)],['Londra',it(g,1,0)],['New York',it(g,8,0)]])}
 <h3>Profilo 7H, forex</h3>${rows([['Asia',it(g,17,0,-1)],['Londra',it(g,0,0)],['New York',it(g,7,0)]])}
 <h3>Quarti di New York</h3>${rows([['Q1',it(g,6,0)],['Q2, True Open',it(g,7,30)],['Q3',it(g,9,0)],['Q4',it(g,10,30)]])}
 <p class="small muted">Questi orari sono quelli italiani: sul grafico MT5 vale l'ora del server del tuo broker.</p>
 <div class="sp"></div><h2>Lista di controllo</h2><p class="muted small" style="margin-top:6px">Se ne manca uno, niente trade.</p><div id="chk"></div>`);
 const items=['DOL e order flow giornaliero sono d\'accordo con il bias','Il bias è pulito e sostenuto dal timeframe alto','La CRT si forma su un key level','Il prezzo ha preso la liquidità e ha chiuso dentro il range','Sono nell\'orario chiave','C\'è conferma sul timeframe basso (CISD, order block)','Ho deciso rischio, stop e obiettivo prima di entrare'];
 const host=b.querySelector('#chk');
 const paint=()=>{host.innerHTML='';items.forEach((t,i)=>{const r=$(`<button class="chk"><span class="box ${S.chk[i]?'ok':''}"></span><span>${t}</span></button>`);r.onclick=()=>{S.chk[i]=!S.chk[i];save();paint()};host.appendChild(r)});
  const n=items.filter((_,i)=>S.chk[i]).length;host.appendChild($(`<p class="note">${n===items.length?'Tutti i punti sono spuntati: il setup rispetta il protocollo.':`${n} su ${items.length}: niente trade.`}</p>`));
  const c=$(`<button class="btn alt">Azzera la lista</button>`);c.onclick=()=>{S.chk={};save();paint()};host.appendChild(c)};paint();
 shell('#/tools',b)}

function gloss(){const b=div(`<h2>Glossario</h2><input type="search" placeholder="Cerca un termine" aria-label="Cerca un termine"><div id="g"></div><div class="sp"></div>`);
 const g=b.querySelector('#g'),inp=b.querySelector('input');
 const paint=()=>{const q=inp.value.toLowerCase();g.innerHTML=GLOSS.filter(x=>(x[0]+x[1]).toLowerCase().includes(q)).map(x=>`<div class="gl"><b>${x[0]}</b>${x[1]}</div>`).join('')||'<p class="muted">Nessun termine trovato. Prova con una sigla, come DOL.</p>'};inp.oninput=paint;paint();
 const m=$(`<button class="btn alt">Pagine del libro e lezioni</button>`);m.onclick=()=>go('#/map');b.appendChild(m);
 const r=$(`<button class="btn alt" style="margin-top:10px">Azzera i progressi</button>`);let arm=false;r.onclick=()=>{if(!arm){arm=true;r.textContent='Tocca di nuovo per azzerare tutto';return}S={done:{},pos:{},wrong:{},sim:{n:0,ok:0},chk:{},open:'m0'};save();go('#/')};b.appendChild(r);
 shell('#/gloss',b)}
function bookmap(){const b=div(`<h2>Pagine del libro</h2><p class="muted small" style="margin-top:6px">Tocca una riga per aprire la lezione che spiega quelle pagine.</p>`);
 BOOKMAP.forEach(([p,t,id])=>{const r=$(`<button class="gl" style="display:block;width:100%;text-align:left"><b>Pag. ${p}</b>${t}</button>`);r.onclick=()=>go('#/l/'+id+'/0');b.appendChild(r)});shell('#/gloss',b)}

function route(){const h=R,p=h.split('/');
 if(p[1]==='l')return lesson(p[2],+p[3]||0);if(p[1]==='fine')return fine(p[2]);
 if(p[1]==='train')return train();if(p[1]==='sim')return sim();if(p[1]==='flash')return flash();
 if(p[1]==='review')return review();
 if(p[1]==='exam')return runQ(shuffle(allQ()).slice(0,15),'Esame generale','#/train');
 if(p[1]==='tools')return tools();if(p[1]==='gloss')return gloss();if(p[1]==='map')return bookmap();
 home()}
route();

</script>
</body></html>
